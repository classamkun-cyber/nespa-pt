<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>売場ピッキング区間計測</title>
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="区間計測">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { box-sizing: border-box; }
  /* ★htmlにも背景色を明示（bodyだけだと、Androidでアドレスバーが引っ込んで
     画面が広がった瞬間などにbody丈が画面高より短くなり、htmlの初期背景＝白が
     下端にはみ出して見える。2026-08-07に正人さんの実機で発見） */
  html {
    background: #101418;
    height: 100%;
  }
  body {
    margin: 0;
    min-height: 100dvh;   /* 動的ビューポート単位＝アドレスバーの出入りでも常に画面いっぱいを確保 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
    background: #101418;
    color: #eaeef2;
    display: flex;
    justify-content: center;
    padding: 24px 12px 60px;
    transition: background 0.3s ease;
  }
  body.running {
    background: #ffffff;
  }
  body.running .display {
    color: #000000;
  }
  .app { width: 100%; max-width: 480px; }
  h1 {
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 20px;
    color: #9fb2c7;
  }
  h1 .ver {
    font-size: 11px;
    font-weight: 400;
    color: #5c6773;
    margin-left: 6px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #7a8794;
    margin-bottom: 6px;
  }
  /* ラベル内の補足（例：（チップで選択可））は少し小さく（V16） */
  label small {
    font-size: 11px;
    opacity: 0.85;
  }
  select, input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    color: #eaeef2;
    background: #1d232b;
    border: 1px solid #2a323b;
    border-radius: 10px;
    margin-bottom: 20px;
    appearance: none;
    -webkit-appearance: none;
  }
  /* 計測中も「どの区間か」を読めるように薄くしすぎない（V16） */
  select:disabled { opacity: 0.75; }
  /* 区間の選択欄は、選択中チップと同じ白枠で「対」にする（V16） */
  #sectionSelect { box-shadow: 0 0 0 2px #ffffff; }
  /* タップ時に出るブラウザ標準のフォーカス枠を消す（白枠＝選択中、と紛らわしいため・V16） */
  select:focus { outline: none; }
  /* 名前と区間を半分ずつ横並びに（V16） */
  .field-row {
    display: flex;
    align-items: flex-end;  /* ラベルが2行になっても入力欄の高さを揃える */
    gap: 10px;
  }
  .field {
    min-width: 0;
  }
  /* 名前:区間 = 4:6（名前側が窮屈だったため3:7から戻した） */
  .field:nth-child(1) { flex: 4 1 0; }
  .field:nth-child(2) { flex: 6 1 0; }
  .display-row {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
    min-height: 56px;
  }
  .cart-lane {
    flex: 1;
    position: relative;
    align-self: stretch;
  }
  .display {
    font-size: 48px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffffff;
    line-height: 1;
  }
  .cart {
    position: absolute;
    top: 50%;
    left: 0;
    font-size: 30px;
    line-height: 1;
    visibility: hidden;
  }
  /* 行き1.4秒（空なので速い）＋右端で1.0秒停止（3個積み込む）＋帰り2.4秒（積んでいるのでゆっくり）
     ＝1サイクル4.8秒。行きと帰りで約1.7倍の速度差。「計測中」の明滅も同じ4.8秒で同期（V16.1） */
  .cart.active {
    visibility: visible;
    animation: roll 4.8s ease-in-out infinite;
  }
  @keyframes roll {
    0%       { left: 0;                 transform: translateY(-50%) scaleX(-1); }
    29.167%  { left: calc(100% - 34px); transform: translateY(-50%) scaleX(-1); } /* 1.4秒＝右端に到着 */
    29.18%   { left: calc(100% - 34px); transform: translateY(-50%) scaleX(1); }  /* 着いたら向きを変える */
    50%      { left: calc(100% - 34px); transform: translateY(-50%) scaleX(1); }  /* 1.0秒停止＝積み込み */
    100%     { left: 0;                 transform: translateY(-50%) scaleX(1); }  /* 2.4秒かけてゆっくり戻る */
  }
  /* カートに積む商品（V16.1・小松原さんの提案）
     行きは空、右端で商品を2個積んで帰ってくる（1往復＝3.6秒でカートの往復と同じサイクル）。
     ※商品が見えるのは必ず帰り道＝カートが反転していない区間なので、商品側で向きを
       打ち消す必要はない（行きは opacity:0 で隠れている） */
  .cart .load {
    position: absolute;
    top: 4px;
    font-size: 12px;
    line-height: 1;
    opacity: 0;
    pointer-events: none;
  }
  /* カゴからはみ出さないよう左寄せ（V16.1調整）。3個目は2個の上に載せて三角に積む */
  .cart .load1 { left: 4px; }
  .cart .load2 { left: 13px; }
  .cart .load3 { left: 8px; top: -3px; }
  /* カート本体を商品より前面に置くと「カゴの中に入っている」ように見える（V16.1） */
  .cart .glyph { position: relative; z-index: 2; }
  .cart .load  { z-index: 1; }
  .cart.active .load1 { animation: load1 4.8s linear infinite; }
  .cart.active .load2 { animation: load2 4.8s linear infinite; }
  .cart.active .load3 { animation: load3 4.8s linear infinite; }
  /* 1個目：カートが右端で止まった直後（1.45秒）に、18px上から0.55秒かけて落ちてくる */
  @keyframes load1 {
    0%,     30.0%  { opacity: 0; transform: translateY(-18px); }
    30.208%        { opacity: 1; transform: translateY(-18px); animation-timing-function: ease-in; }
    41.667%, 96.7% { opacity: 1; transform: translateY(0); }
    100%           { opacity: 0; transform: translateY(0); }
  }
  /* 2個目：1個目より 0.14秒おくれ（ズラすのがミソ） */
  @keyframes load2 {
    0%,     32.9%  { opacity: 0; transform: translateY(-18px); }
    33.125%        { opacity: 1; transform: translateY(-18px); animation-timing-function: ease-in; }
    44.583%, 96.7% { opacity: 1; transform: translateY(0); }
    100%           { opacity: 0; transform: translateY(0); }
  }
  /* 3個目：さらに0.14秒おくれて、下の2個の上（三角の頂点）に着地 */
  @keyframes load3 {
    0%,     35.8%  { opacity: 0; transform: translateY(-18px); }
    36.042%        { opacity: 1; transform: translateY(-18px); animation-timing-function: ease-in; }
    47.5%,  96.7%  { opacity: 1; transform: translateY(0); }
    100%           { opacity: 0; transform: translateY(0); }
  }
  /* 状態表示は計測時間の左横・上下センター（V16） */
  .status {
    flex: 1 1 0;
    min-width: 0;
    font-size: 20px;
    line-height: 1.35;
    text-align: center;
    color: #6fcf97;
  }
  .status.idle { color: #7a8794; }
  /* 計測中＝スタートボタンと同じ緑で、ゆっくり明滅させて「動いている」ことを伝える（V16） */
  body.running .status {
    color: #2f9e6a;
    animation: blink 4.8s ease-in-out infinite;
  }
  /* カートに完全同期（V16.1）。1往復＝呼吸ひとつ。
     左端でパッと点灯 → 空で行く1.4秒＋積み込みの1.0秒は点灯キープ（＝前半2.4秒） →
     荷物を積んで帰る2.4秒でゆっくり暗転 → 左端で荷降ろしと同時にまたパッと点灯 */
  @keyframes blink {
    0%,  50%  { opacity: 1; }
    94%, 100% { opacity: 0.15; }
  }
  .buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  button {
    flex: 1;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.35; cursor: default; }
  .btn-start { background: #2f9e6a; color: white; }
  .btn-stop { background: #d9534f; color: white; }
  .records {
    margin-top: 16px;
    background: #171c22;
    border-radius: 12px;
    overflow: hidden;
  }
  /* 記録クリアは記録一覧カードの下へ・長押しで発動（V16） */
  .clear-zone {
    padding: 14px 16px;
    display: flex;
    justify-content: center;
    border-top: 1px solid #232a33;
  }
  .btn-clear-all {
    position: relative;
    overflow: hidden;
    flex: none;
    width: auto;
    min-width: 220px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid #3a2a2a;
    border-radius: 10px;
    background: #1a1512;
    color: #b98a8a;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
  }
  .btn-clear-all .clear-label {
    position: relative;
    z-index: 1;
  }
  .btn-clear-all.holding .clear-label { color: #ffffff; }
  .clear-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: #d9534f;
    z-index: 0;
  }
  .btn-clear-all.holding .clear-fill {
    width: 100%;
    transition: width 1.4s linear;
  }
  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: #1d232b;
    font-size: 15px;
    color: #8fa0b3;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 18px;
  }
  th, td {
    padding: 11px 8px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid #232a33;
  }
  th { color: #7a8794; font-weight: 500; font-size: 14px; }
  td.num { color: #7a8794; width: 20px; font-size: 14px; }
  td.dur { font-variant-numeric: tabular-nums; color: #ffd479; text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .empty {
    text-align: center;
    padding: 24px;
    color: #5c6773;
    font-size: 15px;
  }
  .total {
    padding: 12px 16px;
    text-align: right;
    font-size: 15px;
    color: #9fb2c7;
    border-top: 1px solid #232a33;
  }
  .total b { color: #ffd479; font-variant-numeric: tabular-nums; font-size: 15px; }
  .section-status {
    background: #171c22;
    border-radius: 12px;
    padding: 14px 16px;
  }
  .section-status-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #8fa0b3;
    margin-bottom: 12px;
  }
  .section-hint {
    font-size: 13px;
    color: #5c6773;
    line-height: 1.5;
    margin-top: 14px;
    text-align: center;
  }
  .reset-zone {
    margin-top: 14px;
    display: flex;
    justify-content: center;
  }
  .btn-reset-all {
    position: relative;
    overflow: hidden;
    flex: none;
    width: auto;
    min-width: 220px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid #3a2a2a;
    border-radius: 10px;
    background: #1a1512;
    color: #b98a8a;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
  }
  .btn-reset-all .reset-label {
    position: relative;
    z-index: 1;
  }
  .btn-reset-all.holding .reset-label { color: #ffffff; }
  .reset-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: #d9534f;
    z-index: 0;
  }
  .btn-reset-all.holding .reset-fill {
    width: 100%;
    transition: width 1.4s linear;
  }
  .chips {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .chip {
    position: relative;
    overflow: hidden;
    font-size: clamp(13px, 4.4vw, 18px);
    padding: 8px 6px;
    text-align: center;
    white-space: nowrap;
    border-radius: 999px;
    background: #232a33;
    color: #c5d0dc;
    border: 1px solid #2a323b;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
  }
  .chip-label { position: relative; z-index: 1; }
  .chip-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: rgba(255,255,255,0.32);
    z-index: 0;
  }
  .chip.holding .chip-fill {
    width: 100%;
    transition: width 1.4s linear;
  }
  .chip.done, .chip.skip {
    background: #d9534f;
    color: #ffffff;
    border-color: #d9534f;
    font-weight: 600;
  }
  .chip.active {
    background: #2f9e6a;
    color: #ffffff;
    border-color: #2f9e6a;
    font-weight: 600;
  }
  /* いま選ばれている区間（タップで選択・V16）＝「区間を選ぶ」欄と同じ白枠で対にする */
  .chip.selected {
    box-shadow: 0 0 0 2px #ffffff;
  }
  .chip small {
    display: block;
    font-size: clamp(10px, 2.7vw, 12px);
    font-weight: 400;
    opacity: 0.9;
    margin-top: 2px;
  }

  /* ---- V18：メンバー間のコメント（チャット）---- */
  /* 新着バナー＝名前・区間の選択行 と 状態＋経過時間の間に配置（2026-08-10・正人さんと確定）
     スタート／ストップから離すことで誤タップを避ける狙い */
  .chat-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 10px;
    background: #232a33;
    color: #8fa0b3;
    font-size: 14px;
    margin-bottom: 20px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .chat-banner-icon { flex: none; }
  .chat-banner-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* 新着あり＝緑系（ページの背景が白でも暗くても、ピル自体が色を持つので読める） */
  .chat-banner.unread {
    background: #1d3a2c;
    color: #bfe8d3;
    font-weight: 600;
  }
  .chat-overlay {
    position: fixed;
    inset: 0;
    background: #101418;
    z-index: 30;
    display: flex;
    flex-direction: column;
  }
  .chat-overlay[hidden] { display: none; }
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    /* iPhoneのステータスバー/ノッチと「← 計測に戻る」が重なりタップ不可になる不具合対策
       （2026-08-11・高橋さん/服部さんのiPhoneで発覚）。上だけセーフエリア分の余白を追加 */
    padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
    border-bottom: 1px solid #232a33;
  }
  .chat-back {
    flex: none;
    width: auto;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    background: #2f9e6a;
    color: #ffffff;
    border-radius: 8px;
  }
  /* ストップ押し忘れ防止に、チャット画面にも「区間名 計測中 ◯分」を表示（Claudian提案） */
  .chat-elapsed {
    font-size: 14px;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  /* 計測中は白でメインの状態表示より少し多めに点滅させる（メイン4.8秒より短い2.4秒周期） */
  .chat-elapsed.running {
    animation: blink 2.4s ease-in-out infinite;
  }
  /* 新着メッセージのプッシュ通知（V19）を許可するボタン。許可済みは控えめに、未許可は目立たせる */
  .notif-btn {
    flex: none;
    width: auto;
    padding: 8px 12px;
    font-size: 12px;
    border-radius: 8px;
    border: 1px solid #2a323b;
    background: #1d232b;
    color: #8fa0b3;
  }
  .notif-btn.on {
    background: #17301f;
    color: #7fd39a;
    border-color: #2f9e6a;
  }
  .notif-btn.unsupported { display: none; }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-msg {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }
  .chat-msg.mine { align-self: flex-end; align-items: flex-end; }
  .chat-msg.other { align-self: flex-start; align-items: flex-start; }
  .chat-msg-meta {
    font-size: 13px;
    color: #ffffff;
    margin-bottom: 4px;
  }
  .chat-msg-to {
    color: #ffffff;
    margin-left: 4px;
  }
  .chat-msg-bubble {
    position: relative;
    overflow: hidden;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
    background: #232a33;
    color: #eaeef2;
  }
  .chat-msg.mine .chat-msg-bubble {
    background: #2f9e6a;
    color: #ffffff;
  }
  /* 自分宛メンションの吹き出しは白背景・黒文字で強調（2026-08-10・白枠から変更） */
  .chat-msg.mention .chat-msg-bubble {
    background: #ffffff;
    color: #000000;
  }
  /* 自分の吹き出しは長押しで削除できる（2026-08-10）。スワイプ阻害を避けるため touch-action: pan-y */
  .chat-msg.mine .chat-msg-bubble {
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
  }
  .chat-msg-text { position: relative; z-index: 1; }
  .chat-msg-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: rgba(0,0,0,0.28);
    z-index: 0;
  }
  .chat-msg-bubble.holding .chat-msg-fill {
    width: 100%;
    transition: width 1.0s linear;
  }
  .chat-hint {
    font-size: 12px;
    color: #5c6773;
    text-align: center;
    margin-bottom: 10px;
  }
  /* 既読件数バッジ（送信者本人を除いた人数）※名前と同じ文字サイズ・色に揃える */
  .chat-msg-read {
    font-size: 13px;
    color: #ffffff;
    margin-top: 2px;
  }
  .chat-empty {
    text-align: center;
    color: #5c6773;
    font-size: 14px;
    margin-top: 40px;
  }
  .chat-input-area {
    padding: 12px 16px 20px;
    border-top: 1px solid #232a33;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .chat-input-row:last-child { margin-bottom: 0; }
  .chat-input-row select,
  .chat-input-row input[type="text"] {
    margin-bottom: 0;
  }
  /* 宛先（左）:定型文（右） */
  #chatToSelect { flex: 4 1 0; }
  #chatPresetSelect { flex: 6 1 0; }
  #chatFreeInput { flex: 1 1 0; }
  #chatSendBtn {
    flex: none;
    width: auto;
    padding: 12px 18px;
    background: #2f9e6a;
    color: #fff;
  }
</style>
</head>
<body>
<div class="app">
  <h1>売場ピッキング区間計測<span class="ver">Ver.19.0</span></h1>
  <div class="field-row">
  <div class="field">
  <label for="userName">あなたの名前</label>
  <select id="userName">
    <option value="平野">平野</option>
    <option value="高橋">高橋</option>
    <option value="小松原">小松原</option>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
  let running = false;
  let startTime = null;
  let currentSection = '';
  let rafId = null;
  let records = [];
  let sharedStatus = {};
  let db = null;
  let chipHolding = false;
  let pendingRender = false;

  const sectionSelect = document.getElementById('sectionSelect');
  const display = document.getElementById('display');
  const cart = document.getElementById('cart');
  const status = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const clearBtn = document.getElementById('clearBtn');
  const tableWrap = document.getElementById('tableWrap');
  const emptyMsg = document.getElementById('emptyMsg');
  const countEl = document.getElementById('count');
  const totalRow = document.getElementById('totalRow');
  const totalTimeEl = document.getElementById('totalTime');
  const sectionListEl = document.getElementById('sectionList');
  const userNameEl = document.getElementById('userName');
  const resetAllBtn = document.getElementById('resetAllBtn');

  // ---- カートに積む商品（V16.1）----
  // 1往復（4.8秒）につき必ず3個（下2個＋上1個の三角積み）。組み合わせは1往復ごとに次の3つへ。
  // 切り替わるのは左端＝どれも見えていない瞬間なので、入れ替わるところは見えない。
  // 並びは売場の順（農産→水産→畜産→デリカ→グロサリ→デイリー→リカー）
  const cartLoads = [
    document.getElementById('cartLoad1'),
    document.getElementById('cartLoad2'),
    document.getElementById('cartLoad3')
  ];
  const LOAD_ITEMS = ['🍎', '🥬', '🐟', '🥩', '🍱', '🍞', '🧃', '🥛', '🥚', '🍺'];
  let loadIndex = 0;
  if (cartLoads.every(Boolean)) {
    const applyLoadItems = () => {
      cartLoads.forEach((el, i) => {
        el.textContent = LOAD_ITEMS[(loadIndex + i) % LOAD_ITEMS.length];
      });
    };
    applyLoadItems();
    // load1（4.8秒サイクル）が1周するたび＝左端で荷物が空になった瞬間に次の3つへ
    cartLoads[0].addEventListener('animationiteration', () => {
      loadIndex = (loadIndex + 3) % LOAD_ITEMS.length;
      applyLoadItems();
    });
  }

  // ---- Firebase（みんなで共有）----
  const firebaseConfig = {
    apiKey: "AIzaSyCzrEc7e9qGPH_2PogrZfFSH8H5Z035aV0",
    authDomain: "nespa-pt.firebaseapp.com",
    databaseURL: "https://nespa-pt-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nespa-pt",
    storageBucket: "nespa-pt.firebasestorage.app",
    messagingSenderId: "247771639596",
    appId: "1:247771639596:web:3b980f4ce44613ed6b0689"
  };
  // 新着チャットのプッシュ通知（V19）に使うWeb Push証明書の公開鍵。
  // Firebaseコンソール → プロジェクト設定 → Cloud Messaging → ウェブ構成 → 「鍵ペアを生成」で発行したものを設定する。
  const VAPID_KEY = "BMPStQYo_XSnzijGlGPs7O6xvLTqOz06YVJnjvUsYd4gwEaAA5SVKPwfoYC5vnYRYLuAqEqpz209gBhKcuqxEmw";

  let messaging = null;
  let swRegistration = null;
  try {
    if (typeof firebase !== 'undefined') {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      db.ref('status').on('value', (snap) => {
        sharedStatus = snap.val() || {};
        renderSections();
      });
      if (firebase.messaging) {
        try { messaging = firebase.messaging(); } catch (e) { messaging = null; }
      }
    }
  } catch (e) { db = null; }

  function fbKey(s) { return String(s).replace(/[.#$\/\[\]]/g, '_'); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function getUserName() { return (userNameEl.value || '').trim(); }

  const savedName = localStorage.getItem('nespaPT_name') || '';
  if (savedName) userNameEl.value = savedName;
  userNameEl.addEventListener('change', () => {
    localStorage.setItem('nespaPT_name', userNameEl.value);
  });

  // ---- 全員リセットは「長押し」で発動（誤タップ防止・V13）----
  const RESET_HOLD_MS = 1400;
  let resetHoldTimer = null;
  let resetHoldStartX = 0;
  let resetHoldStartY = 0;

  function doResetAll() {
    if (db) { try { db.ref('status').remove(); } catch (e) {} }
    else { alert('オフラインのため共有リセットできません。ネットにつながってから再度お試しください。'); }
  }
  function startResetHold(e) {
    // スワイプを妨げないため preventDefault はしない（V16）
    if (resetHoldTimer) return;
    resetHoldStartX = e ? e.clientX : 0;
    resetHoldStartY = e ? e.clientY : 0;
    resetAllBtn.classList.add('holding');
    resetHoldTimer = setTimeout(() => {
      resetHoldTimer = null;
      resetAllBtn.classList.remove('holding');
      if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
      doResetAll();
    }, RESET_HOLD_MS);
  }
  function cancelResetHold() {
    if (resetHoldTimer) { clearTimeout(resetHoldTimer); resetHoldTimer = null; }
    resetAllBtn.classList.remove('holding');
  }
  // 指が動いたらスワイプ（スクロール）とみなして長押しを中止（V16）
  function onResetMove(e) {
    if (!resetHoldTimer) return;
    if (Math.abs(e.clientX - resetHoldStartX) > 8 || Math.abs(e.clientY - resetHoldStartY) > 8) {
      cancelResetHold();
    }
  }
  resetAllBtn.addEventListener('pointerdown', startResetHold);
  resetAllBtn.addEventListener('pointermove', onResetMove);
  resetAllBtn.addEventListener('pointerup', cancelResetHold);
  resetAllBtn.addEventListener('pointerleave', cancelResetHold);
  resetAllBtn.addEventListener('pointercancel', cancelResetHold);
  window.addEventListener('scroll', cancelResetHold, { passive: true });
  // クリックそのものでは何も起こさない（保険）
  resetAllBtn.addEventListener('click', (e) => { e.preventDefault(); });

  // ---- 区間チップの長押し（注文なしマーク／取消）V14 ----
  const CHIP_HOLD_MS = 1400;
  let chipHoldTimer = null;
  let chipHoldEl = null;
  let chipHoldStartX = 0;
  let chipHoldStartY = 0;
  let chipTapCandidate = false;   // 短いタップかどうか（V16）
  let chipLongFired = false;      // 長押しが発動したか（V16）

  // ---- チップをタップ→その区間を選択（V16）----
  function selectSection(section) {
    if (!section) return;
    if (running) return;  // 計測中は区間を変えない（プルダウンも無効中）
    sectionSelect.value = section;
    renderSections();
    if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }
  }
  sectionSelect.addEventListener('change', renderSections);

  function chipStateOf(section) {
    const info = sharedStatus[fbKey(section)];
    return info ? (info.state || 'done') : '';
  }

  // 記録一覧から、その区間の「一番新しい1件」を削除する
  function removeLatestRecord(section) {
    for (let i = records.length - 1; i >= 0; i--) {
      if (records[i].section === section) {
        markLogCancelled(records[i]);  // 蓄積ログ側は消さず「取消」の印だけ立てる（V17）
        records.splice(i, 1);
        saveRecords();
        updateTable();
        return;
      }
    }
  }

  function applyChipLongPress(section, state) {
    const key = fbKey(section);
    if (state === 'done' || state === 'skip') {
      // 赤 → グレー（未着手）に戻す
      if (db) { try { db.ref('status/' + key).remove(); } catch (e) {} }
      // 「完了」を取り消すときは、対応する記録一覧も1件消す
      if (state === 'done') removeLatestRecord(section);
    } else {
      // グレー（未着手）→「注文なし」（赤）
      if (db) {
        try {
          db.ref('status/' + key).set({
            state: 'skip',
            by: getUserName() || '誰か',
            at: formatClock(new Date())
          });
        } catch (e) {}
      } else {
        alert('オフラインのため共有できません。ネットにつながってから再度お試しください。');
      }
    }
  }

  function startChipHold(e) {
    const chip = e.target.closest('.chip');
    if (!chip || !sectionListEl.contains(chip)) return;
    const section = chip.getAttribute('data-section');
    // スワイプを妨げないため preventDefault はしない（V15）
    chipHoldStartX = e.clientX;
    chipHoldStartY = e.clientY;
    chipHoldEl = chip;
    chipTapCandidate = true;
    chipLongFired = false;
    // 計測中の区間は長押し操作なし（タップでの選択だけ受け付ける・V16）
    if (chipStateOf(section) === 'active') return;
    chipHolding = true;
    chip.classList.add('holding');
    chipHoldTimer = setTimeout(() => {
      chipHoldTimer = null;
      chipLongFired = true;
      chipTapCandidate = false;
      chip.classList.remove('holding');
      if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
      applyChipLongPress(section, chipStateOf(section));
      chipHolding = false;
      chipHoldEl = null;
      renderSections();
    }, CHIP_HOLD_MS);
  }

  // 指を離した時点で「長押しが発動していない＝タップ」なら区間を選択（V16）
  function onChipPointerUp() {
    if (chipTapCandidate && !chipLongFired && chipHoldEl) {
      selectSection(chipHoldEl.getAttribute('data-section'));
    }
    chipTapCandidate = false;
    cancelChipHold();
  }
  function cancelChipHold() {
    if (chipHoldTimer) { clearTimeout(chipHoldTimer); chipHoldTimer = null; }
    if (chipHoldEl) chipHoldEl.classList.remove('holding');
    chipHoldEl = null;
    chipHolding = false;
    if (pendingRender) renderSections();
  }
  function onChipMove(e) {
    if (!chipHoldEl) return;
    // 指が動いたらスワイプ（スクロール）とみなして長押し・タップを中止（V15/V16）
    if (Math.abs(e.clientX - chipHoldStartX) > 8 || Math.abs(e.clientY - chipHoldStartY) > 8) {
      chipTapCandidate = false;
      cancelChipHold();
      return;
    }
    const chip = e.target.closest('.chip');
    if (chip !== chipHoldEl) {
      chipTapCandidate = false;
      cancelChipHold();
    }
  }
  function onChipAbort() {
    chipTapCandidate = false;
    cancelChipHold();
  }
  sectionListEl.addEventListener('pointerdown', startChipHold);
  sectionListEl.addEventListener('pointermove', onChipMove);
  sectionListEl.addEventListener('pointerup', onChipPointerUp);
  sectionListEl.addEventListener('pointerleave', onChipAbort);
  sectionListEl.addEventListener('pointercancel', onChipAbort);
  window.addEventListener('scroll', onChipAbort, { passive: true });

  function formatDuration(ms) {
    return Math.floor(ms / 60000) + '分';
  }

  function formatClock(date) {
    return String(date.getHours()).padStart(2,'0') + ':' +
           String(date.getMinutes()).padStart(2,'0');
  }

  // ---- V17：記録の蓄積（分析用にログを貯める）----
  // メンバーから見える動きはゼロ。ストップを押した瞬間に、開始・終了の生の時刻（ms）を
  // logs/{YYYY-MM-DD}/{自動ID} にこっそり1件書くだけ。表示・操作は一切変えない。
  function formatDateStr(date) {
    return date.getFullYear() + '-' +
           String(date.getMonth()+1).padStart(2,'0') + '-' +
           String(date.getDate()).padStart(2,'0');
  }
  // 開始した日付を基準にする（日をまたいで計測することは想定しない）
  function writeLog(section, name, startMs, endMs) {
    if (!db) return null;
    const logDate = formatDateStr(new Date(startMs));
    try {
      const ref = db.ref('logs/' + logDate).push();
      ref.set({
        区間: section,
        名前: name || 'ゲスト',
        開始: startMs,
        終了: endMs,
        取消: false
      });
      return { logDate, logId: ref.key };
    } catch (e) { return null; }
  }
  // V14の「完了の取消」に連動して、蓄積ログ側は削除せず「取消済み」の印を立てる
  function markLogCancelled(rec) {
    if (!db || !rec || !rec.logDate || !rec.logId) return;
    try { db.ref('logs/' + rec.logDate + '/' + rec.logId).update({ 取消: true }); } catch (e) {}
  }

  function saveRecords() {
    try { localStorage.setItem('nespaPT', JSON.stringify(records)); } catch (e) {}
  }

  function loadRecords() {
    try {
      const raw = localStorage.getItem('nespaPT');
      if (raw) records = JSON.parse(raw) || [];
    } catch (e) { records = []; }
  }

  // ---- 進行中セッションの保存／復元（V12）----
  // 計測中にリロード・タブ/ブラウザを閉じても、開き直したときに計測を継続できるようにする
  const ACTIVE_KEY = 'nespaPT_active';
  function saveActive() {
    try {
      localStorage.setItem(ACTIVE_KEY, JSON.stringify({
        section: currentSection,
        startTime: startTime,
        name: getUserName()
      }));
    } catch (e) {}
  }
  function clearActive() {
    try { localStorage.removeItem(ACTIVE_KEY); } catch (e) {}
  }

  function tick() {
    const elapsed = Date.now() - startTime;
    display.textContent = formatDuration(elapsed);
    if (chatOpen) updateChatElapsed();
    rafId = requestAnimationFrame(tick);
  }

  function renderSections() {
    // 長押し中はDOMを作り替えない（操作が途切れないように／終わったら描き直す）
    if (chipHolding) { pendingRender = true; return; }
    pendingRender = false;
    let html = '';
    Array.from(sectionSelect.options).forEach(opt => {
      const info = sharedStatus[fbKey(opt.value)];
      let cls = '';
      let meta = '';
      if (info) {
        const state = info.state || 'done';
        const who = info.by ? escapeHtml(info.by) : '';
        const when = info.at ? escapeHtml(info.at) : '';
        if (state === 'active') {
          cls = ' active';
          const parts = [who, '計測中'].filter(Boolean).join(' ');
          meta = `<small>${parts}</small>`;
        } else if (state === 'skip') {
          cls = ' skip';
          const parts = ['注文なし', who].filter(Boolean).join(' ');
          meta = `<small>${parts}</small>`;
        } else {
          cls = ' done';
          const parts = [who, when].filter(Boolean).join(' ');
          if (parts) meta = `<small>${parts}</small>`;
        }
      }
      // 未着手（グレー）でも1行分のスペースを確保して高さを揃える（V15）
      if (!meta) meta = '<small>&nbsp;</small>';
      // いま選ばれている区間に枠を付ける（V16）
      if (opt.value === sectionSelect.value) cls += ' selected';
      html += `<span class="chip${cls}" data-section="${escapeHtml(opt.value)}"><span class="chip-fill"></span><span class="chip-label">${escapeHtml(opt.value)}${meta}</span></span>`;
    });
    sectionListEl.innerHTML = html;
  }

  function updateTable() {
    renderSections();
    if (records.length === 0) {
      tableWrap.innerHTML = '';
      tableWrap.appendChild(emptyMsg);
      totalRow.style.display = 'none';
      countEl.textContent = '0件';
      return;
    }
    let html = '<table><thead><tr><th>#</th><th>区間</th><th>開始</th><th>終了</th><th>経過</th></tr></thead><tbody>';
    let total = 0;
    records.forEach((r, i) => {
      total += r.durationMs;
      html += `<tr>
        <td class="num">${i+1}</td>
        <td>${r.section}</td>
        <td>${r.startStr}</td>
        <td>${r.endStr}</td>
        <td class="dur">${formatDuration(r.durationMs)}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    tableWrap.innerHTML = html;
    countEl.textContent = records.length + '件';
    totalRow.style.display = 'block';
    totalTimeEl.textContent = formatDuration(total);
  }

  startBtn.addEventListener('click', () => {
    // 共有の区間の状況をもとに、完了済み／計測中の区間なら確認する（V12）
    const selectedSection = sectionSelect.value;
    const selInfo = sharedStatus[fbKey(selectedSection)];
    if (selInfo) {
      const selState = selInfo.state || 'done';
      const selWho = selInfo.by || '誰か';
      if (selState === 'active') {
        alert('この区間は ' + selWho + ' さんが計測中です。');
        return;
      } else if (selState === 'done') {
        if (!confirm('この区間はすでに完了しています。もう一度計測し直しますか？')) return;
      } else if (selState === 'skip') {
        if (!confirm('この区間は「注文なし」になっています。計測しますか？')) return;
      }
    }
    running = true;
    startTime = Date.now();
    currentSection = sectionSelect.value;
    sectionSelect.disabled = true;
    userNameEl.disabled = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    clearBtn.disabled = true;
    status.textContent = '計測中';
    status.classList.remove('idle');
    cart.classList.add('active');
    document.body.classList.add('running');
    saveActive();
    if (db) {
      try {
        db.ref('status/' + fbKey(currentSection)).set({
          state: 'active',
          by: getUserName() || '誰か',
          at: formatClock(new Date(startTime))
        });
      } catch (e) {}
    }
    tick();
  });

  stopBtn.addEventListener('click', () => {
    if (!running) return;
    running = false;
    clearActive();
    cancelAnimationFrame(rafId);
    cart.classList.remove('active');
    document.body.classList.remove('running');
    const endTime = Date.now();
    const durationMs = endTime - startTime;
    const logRef = writeLog(currentSection, getUserName(), startTime, endTime);
    records.push({
      section: currentSection,
      startStr: formatClock(new Date(startTime)),
      endStr: formatClock(new Date(endTime)),
      durationMs,
      logDate: logRef ? logRef.logDate : null,
      logId: logRef ? logRef.logId : null
    });
    saveRecords();
    display.textContent = formatDuration(durationMs);
    status.textContent = '停止中';
    status.classList.add('idle');
    sectionSelect.disabled = false;
    userNameEl.disabled = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    clearBtn.disabled = false;
    if (db) {
      try {
        db.ref('status/' + fbKey(currentSection)).set({
          state: 'done',
          by: getUserName() || '誰か',
          at: formatClock(new Date(endTime))
        });
      } catch (e) {}
    }
    updateTable();
  });

  // ---- 記録クリアも「長押し」で発動（誤タップ防止・V16）----
  const CLEAR_HOLD_MS = 1400;
  let clearHoldTimer = null;
  let clearHoldStartX = 0;
  let clearHoldStartY = 0;

  function doClearRecords() {
    records = [];
    saveRecords();
    display.textContent = '0分';
    updateTable();
  }
  function startClearHold(e) {
    if (clearHoldTimer) return;
    clearHoldStartX = e ? e.clientX : 0;
    clearHoldStartY = e ? e.clientY : 0;
    clearBtn.classList.add('holding');
    clearHoldTimer = setTimeout(() => {
      clearHoldTimer = null;
      clearBtn.classList.remove('holding');
      if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
      doClearRecords();
    }, CLEAR_HOLD_MS);
  }
  function cancelClearHold() {
    if (clearHoldTimer) { clearTimeout(clearHoldTimer); clearHoldTimer = null; }
    clearBtn.classList.remove('holding');
  }
  function onClearMove(e) {
    if (!clearHoldTimer) return;
    if (Math.abs(e.clientX - clearHoldStartX) > 8 || Math.abs(e.clientY - clearHoldStartY) > 8) {
      cancelClearHold();
    }
  }
  clearBtn.addEventListener('pointerdown', startClearHold);
  clearBtn.addEventListener('pointermove', onClearMove);
  clearBtn.addEventListener('pointerup', cancelClearHold);
  clearBtn.addEventListener('pointerleave', cancelClearHold);
  clearBtn.addEventListener('pointercancel', cancelClearHold);
  window.addEventListener('scroll', cancelClearHold, { passive: true });
  // クリックそのものでは何も起こさない（保険）
  clearBtn.addEventListener('click', (e) => { e.preventDefault(); });

  // ---- V18：メンバー間のコメント（チャット）----
  // データは messages/{自動ID} にフラットに保存（push key が時系列順に文字列比較できるので
  // それを既読管理にそのまま使う）。全体のお知らせ欄＝A案（正人さんと合意ずみ）。
  const chatBanner = document.getElementById('chatBanner');
  const chatBannerText = document.getElementById('chatBannerText');
  const chatOverlay = document.getElementById('chatOverlay');
  const chatBackBtn = document.getElementById('chatBackBtn');
  const chatElapsedEl = document.getElementById('chatElapsed');
  const chatMessagesEl = document.getElementById('chatMessages');
  const chatEmptyEl = document.getElementById('chatEmpty');
  const chatToSelect = document.getElementById('chatToSelect');
  const chatPresetSelect = document.getElementById('chatPresetSelect');
  const chatFreeInput = document.getElementById('chatFreeInput');
  const chatSendBtn = document.getElementById('chatSendBtn');
  const notifBtn = document.getElementById('notifBtn');

  let chatMessages = [];   // 古い順に並べて保持（[{key, text, name, to, time}, ...]）
  let chatOpen = false;
  const CHAT_READ_KEY = 'nespaPT_chatLastRead';

  function getChatLastRead() {
    try { return localStorage.getItem(CHAT_READ_KEY) || ''; } catch (e) { return ''; }
  }
  function setChatLastRead(key) {
    try { localStorage.setItem(CHAT_READ_KEY, key); } catch (e) {}
  }

  function renderChatBanner() {
    const lastRead = getChatLastRead();
    const unread = chatMessages.filter(m => m.key > lastRead);
    if (unread.length === 0) {
      chatBanner.className = 'chat-banner';
      chatBannerText.textContent = 'チャット';
      return;
    }
    const latest = unread[unread.length - 1];
    const preview = (latest.name || '?') + (latest.to ? '→' + latest.to : '') + '：' + latest.text;
    // バナーの色は宛先に関わらず一律で緑（2026-08-10・色分けは廃止してシンプルに）
    chatBanner.className = 'chat-banner unread';
    chatBannerText.textContent = preview + '（' + unread.length + '件）';
  }

  function renderChatMessages() {
    if (chatMessages.length === 0) {
      chatMessagesEl.innerHTML = '';
      chatMessagesEl.appendChild(chatEmptyEl);
      return;
    }
    const myName = getUserName();
    let html = '';
    chatMessages.forEach(m => {
      const mine = m.name === myName;
      const mentionToMe = !!(m.to && m.to === myName);
      const cls = 'chat-msg ' + (mine ? 'mine' : 'other') + (mentionToMe ? ' mention' : '');
      const toTag = m.to ? `<span class="chat-msg-to">→${escapeHtml(m.to)}</span>` : '';
      const timeStr = m.time ? formatClock(new Date(m.time)) : '';
      // 自分の吹き出しだけ data-key を持たせ、長押しで削除できるようにする（2026-08-10）
      const bubble = mine
        ? `<div class="chat-msg-bubble" data-key="${escapeHtml(m.key)}"><span class="chat-msg-fill"></span><span class="chat-msg-text">${escapeHtml(m.text)}</span></div>`
        : `<div class="chat-msg-bubble">${escapeHtml(m.text)}</div>`;
      // 既読バッジ＝送信者本人を除いた readBy の人数（LINEの「既読」と同じ考え方）
      const readers = m.readBy ? Object.keys(m.readBy).filter(n => n !== m.name) : [];
      const readBadge = readers.length ? `<div class="chat-msg-read">既読 ${readers.length}</div>` : '';
      html += `<div class="${cls}">
        <div class="chat-msg-meta">${escapeHtml(m.name || '?')} ${timeStr}${toTag}</div>
        ${bubble}
        ${readBadge}
      </div>`;
    });
    chatMessagesEl.innerHTML = html;
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  // ---- 自分の吹き出しを長押しで削除（2026-08-10）----
  const MSG_HOLD_MS = 1000;
  let msgHoldTimer = null;
  let msgHoldEl = null;
  let msgHoldStartX = 0;
  let msgHoldStartY = 0;

  function deleteChatMessage(key) {
    if (!db || !key) return;
    try { db.ref('messages/' + key).remove(); } catch (e) {}
  }
  function startMsgHold(e) {
    const bubble = e.target.closest('.chat-msg-bubble');
    if (!bubble || !bubble.hasAttribute('data-key')) return;  // 自分の吹き出し以外は何もしない
    msgHoldStartX = e.clientX;
    msgHoldStartY = e.clientY;
    msgHoldEl = bubble;
    bubble.classList.add('holding');
    msgHoldTimer = setTimeout(() => {
      msgHoldTimer = null;
      bubble.classList.remove('holding');
      if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
      deleteChatMessage(bubble.getAttribute('data-key'));
      msgHoldEl = null;
    }, MSG_HOLD_MS);
  }
  function cancelMsgHold() {
    if (msgHoldTimer) { clearTimeout(msgHoldTimer); msgHoldTimer = null; }
    if (msgHoldEl) msgHoldEl.classList.remove('holding');
    msgHoldEl = null;
  }
  function onMsgMove(e) {
    if (!msgHoldEl) return;
    // 指が動いたらスクロールとみなして長押しを中止（他の長押しUIと同じ作法）
    if (Math.abs(e.clientX - msgHoldStartX) > 8 || Math.abs(e.clientY - msgHoldStartY) > 8) {
      cancelMsgHold();
    }
  }
  chatMessagesEl.addEventListener('pointerdown', startMsgHold);
  chatMessagesEl.addEventListener('pointermove', onMsgMove);
  chatMessagesEl.addEventListener('pointerup', cancelMsgHold);
  chatMessagesEl.addEventListener('pointerleave', cancelMsgHold);
  chatMessagesEl.addEventListener('pointercancel', cancelMsgHold);
  chatMessagesEl.addEventListener('scroll', cancelMsgHold, { passive: true });

  // ---- 既読バッジ（2026-08-10）----
  // messages/{key}/readBy/{名前} = true を立てるだけ。自分の送信分は対象外（読む必要がないので）。
  // すでに立っているものは書き直さない（無駄な書き込みを避ける）。
  function markMessagesRead() {
    if (!db) return;
    const myName = getUserName();
    if (!myName) return;
    chatMessages.forEach(m => {
      if (m.name === myName) return;
      if (m.readBy && m.readBy[myName]) return;
      try { db.ref('messages/' + m.key + '/readBy/' + myName).set(true); } catch (e) {}
    });
  }

  // 直近100件だけ購読（現場のやりとりが読めれば十分・古いものは追わない）
  if (db) {
    try {
      db.ref('messages').limitToLast(100).on('value', (snap) => {
        const val = snap.val() || {};
        chatMessages = Object.keys(val).sort().map(key => Object.assign({ key }, val[key]));
        // パネルを開いている間に届いた分（自分が今送った分も含む）はその場で既読扱いにする
        // ＝そうしないと「今開いて送ったメッセージ」が、閉じた瞬間バナーの新着として出てしまう
        if (chatOpen && chatMessages.length) {
          setChatLastRead(chatMessages[chatMessages.length - 1].key);
          markMessagesRead();
        }
        renderChatBanner();
        if (chatOpen) renderChatMessages();
      });
    } catch (e) {}
  }

  // ---- V18.1：定型文を Firebase から動的に読み込む（正人さんの編集アプリで増減できるように）----
  // 表示順は order 昇順。プレースホルダー（先頭の「定型文を選ぶ▼」）は常に残す。
  function renderPresetOptions(list) {
    const current = chatPresetSelect.value;
    const placeholder = '<option value="" selected>定型文を選ぶ▼</option>';
    const opts = list
      .slice()
      .sort((a, b) => (a.order || 0) - (b.order || 0))
      .map(t => `<option value="${escapeHtml(t.text)}">${escapeHtml(t.text)}</option>`)
      .join('');
    chatPresetSelect.innerHTML = placeholder + opts;
    // 選択中に更新が飛んできても、選択状態はできるだけ保つ（無ければプレースホルダーへ）
    chatPresetSelect.value = current && [...chatPresetSelect.options].some(o => o.value === current) ? current : '';
  }
  if (db) {
    try {
      db.ref('templates').on('value', (snap) => {
        const val = snap.val() || {};
        const list = Object.keys(val).map(key => Object.assign({ key }, val[key]));
        renderPresetOptions(list);
      });
    } catch (e) {}
  }

  function updateChatElapsed() {
    if (!chatElapsedEl) return;
    chatElapsedEl.classList.toggle('running', running);
    chatElapsedEl.textContent = running ? (currentSection + ' 計測中 ' + display.textContent) : '';
  }

  function openChat() {
    chatOpen = true;
    chatOverlay.hidden = false;
    renderChatMessages();
    // V18初版は「開いたら既読」のシンプルな判定（正人さんと合意ずみ）
    if (chatMessages.length) setChatLastRead(chatMessages[chatMessages.length - 1].key);
    markMessagesRead();
    renderChatBanner();
    updateChatElapsed();
    // Androidの戻るボタンでも閉じられるように履歴を1つ積む
    try { history.pushState({ nespaPTChat: true }, ''); } catch (e) {}
  }
  function closeChat(fromPopstate) {
    chatOpen = false;
    chatOverlay.hidden = true;
    if (!fromPopstate) {
      try { history.back(); } catch (e) {}
    }
  }
  window.addEventListener('popstate', () => {
    if (chatOpen) closeChat(true);
  });

  chatBanner.addEventListener('click', openChat);
  chatBanner.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openChat(); }
  });
  chatBackBtn.addEventListener('click', () => closeChat(false));

  function sendChatMessage(text, to) {
    const t = (text || '').trim();
    if (!t) return;
    if (!db) { alert('オフラインのため送信できません。ネットにつながってから再度お試しください。'); return; }
    const payload = { text: t, name: getUserName() || 'ゲスト', time: Date.now() };
    if (to) payload.to = to;
    try { db.ref('messages').push(payload); } catch (e) {}
  }

  // 定型文プルダウン＝選んだ瞬間に即送信（2タップ完結）。
  // 同じ項目を連続で選んでも change が発火するよう、送信のたびに初期表示へ戻す。
  chatPresetSelect.addEventListener('change', () => {
    const text = chatPresetSelect.value;
    if (!text) return;
    const to = chatToSelect.value || '';
    sendChatMessage(text, to);
    chatPresetSelect.value = '';
    chatToSelect.value = '';   // 宛先も毎回「全員」に戻す（正人さんの依頼・2026-08-10）
  });

  chatSendBtn.addEventListener('click', () => {
    const to = chatToSelect.value || '';
    sendChatMessage(chatFreeInput.value, to);
    chatFreeInput.value = '';
    chatToSelect.value = '';
  });
  chatFreeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const to = chatToSelect.value || '';
      sendChatMessage(chatFreeInput.value, to);
      chatFreeInput.value = '';
      chatToSelect.value = '';
    }
  });

  // ---- V19：新着チャットのプッシュ通知 ----
  // fcmTokens/{名前}/{token} = true の形でFirebaseに登録しておくと、Cloud Functions側が
  // 新着メッセージ時に送信者以外へ配信してくれる（アプリを閉じていても・画面オフでも届く）。
  function updateNotifBtn() {
    if (!notifBtn) return;
    if (!('Notification' in window) || !messaging) {
      notifBtn.classList.add('unsupported');
      return;
    }
    if (Notification.permission === 'granted') {
      notifBtn.textContent = '🔔 通知オン';
      notifBtn.classList.add('on');
    } else {
      notifBtn.textContent = '🔔 通知オフ';
      notifBtn.classList.remove('on');
    }
  }

  // 取得したトークンを、今入力されている名前に紐づけて保存する（名前が空ならスキップ＝あとで名前欄変更時に再同期）
  function syncFcmToken(token) {
    if (!db || !token) return;
    const myName = getUserName();
    if (!myName) return;
    try { db.ref('fcmTokens/' + fbKey(myName) + '/' + token).set(true); } catch (e) {}
  }

  let currentFcmToken = null;
  function refreshFcmToken() {
    if (!messaging || !swRegistration) return;
    if (!VAPID_KEY || VAPID_KEY.indexOf('PLACEHOLDER') === 0) return; // 鍵未設定のうちは何もしない
    messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swRegistration })
      .then((token) => {
        if (!token) return;
        currentFcmToken = token;
        syncFcmToken(token);
      })
      .catch((e) => { console.warn('FCMトークン取得に失敗', e); });
  }

  if (notifBtn) {
    notifBtn.addEventListener('click', async () => {
      if (!('Notification' in window) || !messaging) {
        alert('この端末・ブラウザは通知に対応していません');
        return;
      }
      try {
        const permission = await Notification.requestPermission();
        updateNotifBtn();
        if (permission !== 'granted') {
          alert('通知が許可されませんでした。あとで端末の通知設定から許可することもできます。');
          return;
        }
        if (!swRegistration) swRegistration = await navigator.serviceWorker.ready;
        refreshFcmToken();
      } catch (e) {
        alert('通知の設定に失敗しました: ' + e.message);
      }
    });
  }

  // 名前を選び直した／変えたときも、既に通知オンならそのトークンを新しい名前に登録し直す
  userNameEl.addEventListener('change', () => {
    if (currentFcmToken) syncFcmToken(currentFcmToken);
  });

  updateNotifBtn();

  // 計測中に閉じた／リロードした場合、開き直したときに計測を復元して継続する（V12）
  function restoreActive() {
    let raw = null;
    try { raw = localStorage.getItem(ACTIVE_KEY); } catch (e) {}
    if (!raw) return;
    let s = null;
    try { s = JSON.parse(raw); } catch (e) { s = null; }
    if (!s || !s.section || !s.startTime) { clearActive(); return; }

    running = true;
    startTime = s.startTime;
    currentSection = s.section;
    if (s.name) userNameEl.value = s.name;
    sectionSelect.value = s.section;

    sectionSelect.disabled = true;
    userNameEl.disabled = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    clearBtn.disabled = true;
    status.textContent = '計測中';
    status.classList.remove('idle');
    cart.classList.add('active');
    document.body.classList.add('running');

    // 共有側にも「計測中」を再登録（開始時刻はそのまま維持）
    if (db) {
      try {
        db.ref('status/' + fbKey(currentSection)).set({
          state: 'active',
          by: getUserName() || '誰か',
          at: formatClock(new Date(startTime))
        });
      } catch (e) {}
    }
    tick();
  }

  loadRecords();
  updateTable();
  restoreActive();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        swRegistration = reg;
        // この端末で既に通知が許可済みなら、ページを開くたびに静かにトークンを最新化しておく
        if ('Notification' in window && Notification.permission === 'granted') refreshFcmToken();
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
