<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>売場ピッキング区間計測</title>
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="区間計測">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
    background: #101418;
    color: #eaeef2;
    display: flex;
    justify-content: center;
    padding: 24px 12px 60px;
  }
  .app { width: 100%; max-width: 480px; }
  h1 {
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 20px;
    color: #9fb2c7;
  }
  label {
    display: block;
    font-size: 12px;
    color: #7a8794;
    margin-bottom: 6px;
  }
  select {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    color: #eaeef2;
    background: #1d232b;
    border: 1px solid #2a323b;
    border-radius: 10px;
    margin-bottom: 20px;
    appearance: none;
    -webkit-appearance: none;
  }
  select:disabled { opacity: 0.5; }
  .display-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 20px;
    min-height: 56px;
  }
  .display {
    font-size: 48px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffffff;
    line-height: 1;
  }
  .hourglass {
    font-size: 30px;
    line-height: 1;
    visibility: hidden;
    transform-origin: center;
  }
  .hourglass.active {
    visibility: visible;
    animation: flip 4s ease-in-out infinite;
  }
  @keyframes flip {
    0%   { transform: rotate(0deg); }
    40%  { transform: rotate(0deg); }
    50%  { transform: rotate(180deg); }
    90%  { transform: rotate(180deg); }
    100% { transform: rotate(360deg); }
  }
  .status {
    text-align: center;
    font-size: 13px;
    margin-bottom: 20px;
    height: 16px;
    color: #6fcf97;
  }
  .status.idle { color: #7a8794; }
  .buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  button {
    flex: 1;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.35; cursor: default; }
  .btn-start { background: #2f9e6a; color: white; }
  .btn-stop { background: #d9534f; color: white; }
  .btn-clear {
    background: #2a323b;
    color: #cfd8e3;
    flex: none;
    width: 46px;
    padding: 14px 0;
  }
  .records {
    background: #171c22;
    border-radius: 12px;
    overflow: hidden;
  }
  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: #1d232b;
    font-size: 13px;
    color: #8fa0b3;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid #232a33;
  }
  th { color: #7a8794; font-weight: 500; font-size: 12px; }
  td.num { color: #7a8794; width: 24px; }
  td.dur { font-variant-numeric: tabular-nums; color: #ffd479; text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .empty {
    text-align: center;
    padding: 24px;
    color: #5c6773;
    font-size: 13px;
  }
  .total {
    padding: 12px 16px;
    text-align: right;
    font-size: 13px;
    color: #9fb2c7;
    border-top: 1px solid #232a33;
  }
  .total b { color: #ffd479; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="app">
  <h1>売場ピッキング区間計測</h1>
  <label for="sectionSelect">区間を選ぶ</label>
  <select id="sectionSelect">
    <option value="農産">農産</option>
    <option value="水産">水産</option>
    <option value="畜産">畜産</option>
    <option value="デリカ">デリカ</option>
    <option value="グロサリ①">グロサリ①</option>
    <option value="グロサリ②">グロサリ②</option>
    <option value="グロサリ③">グロサリ③</option>
    <option value="デイリー①">デイリー①</option>
    <option value="デイリー②">デイリー②</option>
    <option value="デイリー③">デイリー③</option>
    <option value="デリコン">デリコン</option>
    <option value="リカー">リカー</option>
    <option value="ケース">ケース</option>
    <option value="その他">その他</option>
    <option value="衣料・住余">衣料・住余</option>
    <option value="フリー">フリー</option>
  </select>
  <div class="display-row">
    <span class="display" id="display">0分</span>
    <span class="hourglass" id="hourglass">⏳</span>
  </div>
  <div class="status idle" id="status">停止中</div>
  <div class="buttons">
    <button class="btn-start" id="startBtn">スタート</button>
    <button class="btn-stop" id="stopBtn" disabled>ストップ</button>
    <button class="btn-clear" id="clearBtn" title="記録クリア">C</button>
  </div>
  <div class="records">
    <div class="records-header">
      <span>記録一覧</span>
      <span id="count">0件</span>
    </div>
    <div id="tableWrap">
      <div class="empty" id="emptyMsg">まだ記録がありません</div>
    </div>
    <div class="total" id="totalRow" style="display:none;">
      合計時間: <b id="totalTime">0分</b>
    </div>
  </div>
</div>

<script>
  let running = false;
  let startTime = null;
  let currentSection = '';
  let rafId = null;
  let records = [];

  const sectionSelect = document.getElementById('sectionSelect');
  const display = document.getElementById('display');
  const hourglass = document.getElementById('hourglass');
  const status = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const clearBtn = document.getElementById('clearBtn');
  const tableWrap = document.getElementById('tableWrap');
  const emptyMsg = document.getElementById('emptyMsg');
  const countEl = document.getElementById('count');
  const totalRow = document.getElementById('totalRow');
  const totalTimeEl = document.getElementById('totalTime');

  function formatDuration(ms) {
    return Math.floor(ms / 60000) + '分';
  }

  function formatClock(date) {
    return String(date.getHours()).padStart(2,'0') + ':' +
           String(date.getMinutes()).padStart(2,'0');
  }

  function saveRecords() {
    try { localStorage.setItem('nespaPT', JSON.stringify(records)); } catch (e) {}
  }

  function loadRecords() {
    try {
      const raw = localStorage.getItem('nespaPT');
      if (raw) records = JSON.parse(raw) || [];
    } catch (e) { records = []; }
  }

  function tick() {
    const elapsed = Date.now() - startTime;
    display.textContent = formatDuration(elapsed);
    rafId = requestAnimationFrame(tick);
  }

  function updateTable() {
    if (records.length === 0) {
      tableWrap.innerHTML = '';
      tableWrap.appendChild(emptyMsg);
      totalRow.style.display = 'none';
      countEl.textContent = '0件';
      return;
    }
    let html = '<table><thead><tr><th>#</th><th>区間</th><th>開始</th><th>終了</th><th>経過</th></tr></thead><tbody>';
    let total = 0;
    records.forEach((r, i) => {
      total += r.durationMs;
      html += `<tr>
        <td class="num">${i+1}</td>
        <td>${r.section}</td>
        <td>${r.startStr}</td>
        <td>${r.endStr}</td>
        <td class="dur">${formatDuration(r.durationMs)}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    tableWrap.innerHTML = html;
    countEl.textContent = records.length + '件';
    totalRow.style.display = 'block';
    totalTimeEl.textContent = formatDuration(total);
  }

  startBtn.addEventListener('click', () => {
    running = true;
    startTime = Date.now();
    currentSection = sectionSelect.value;
    sectionSelect.disabled = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    clearBtn.disabled = true;
    status.textContent = '計測中... ' + currentSection;
    status.classList.remove('idle');
    hourglass.classList.add('active');
    tick();
  });

  stopBtn.addEventListener('click', () => {
    if (!running) return;
    running = false;
    cancelAnimationFrame(rafId);
    hourglass.classList.remove('active');
    const endTime = Date.now();
    const durationMs = endTime - startTime;
    records.push({
      section: currentSection,
      startStr: formatClock(new Date(startTime)),
      endStr: formatClock(new Date(endTime)),
      durationMs
    });
    saveRecords();
    display.textContent = formatDuration(durationMs);
    status.textContent = '停止中';
    status.classList.add('idle');
    sectionSelect.disabled = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    clearBtn.disabled = false;
    updateTable();
  });

  clearBtn.addEventListener('click', () => {
    records = [];
    saveRecords();
    display.textContent = '0分';
    updateTable();
  });

  loadRecords();
  updateTable();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
