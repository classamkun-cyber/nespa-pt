<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>売場ピッキング区間計測</title>
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="区間計測">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { box-sizing: border-box; }
  /* ★htmlにも背景色を明示（bodyだけだと、Androidでアドレスバーが引っ込んで
     画面が広がった瞬間などにbody丈が画面高より短くなり、htmlの初期背景＝白が
     下端にはみ出して見える。2026-08-07に正人さんの実機で発見） */
  html {
    background: #101418;
    height: 100%;
    /* V20.1：チャット入力欄（名前・区間・定型文・自由入力）付近をスワイプすると、裏のbodyが
       わずかに引っ張られて上下に動くラバーバンド（跳ね返り）スクロールが出ていたための対策
       （正人さんの実機報告・2026-08-25）。ページ自体の伸び縮みを止める。 */
    overscroll-behavior: none;
  }
  body {
    margin: 0;
    min-height: 100dvh;   /* 動的ビューポート単位＝アドレスバーの出入りでも常に画面いっぱいを確保 */
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
    background: #101418;
    color: #eaeef2;
    display: flex;
    justify-content: center;
    overscroll-behavior: none;
    /* V19.13：iPhoneのステータスバー/Dynamic Islandとタイトルが重なる不具合対策。
       チャット画面（.chat-header）は2026-08-11に対策済みだったが、計測画面（body）側は
       未対応のまま残っていた（2026-08-20・正人さんの指摘で発覚）。
       max()でAndroid（env=0が普通）は元の24pxのまま変えず、iPhoneのノッチ/Dynamic Island分
       だけ上乗せする。安全マージンに8pxだけ足すのは、env値ちょうどだと文字がステータスバーの
       すぐ下に張り付いて見えるため */
    padding: max(24px, calc(env(safe-area-inset-top) + 8px)) 12px 60px;
    transition: background 0.3s ease;
  }
  body.running {
    background: #ffffff;
  }
  body.running .display {
    color: #000000;
  }
  .app { width: 100%; max-width: 480px; }
  h1 {
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 20px;
    color: #9fb2c7;
  }
  h1 .ver {
    font-size: 11px;
    font-weight: 400;
    color: #5c6773;
    margin-left: 6px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #7a8794;
    margin-bottom: 6px;
  }
  /* ラベル内の補足（例：（チップで選択可））は少し小さく（V16） */
  label small {
    font-size: 11px;
    opacity: 0.85;
  }
  select, input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    color: #eaeef2;
    background: #1d232b;
    border: 1px solid #2a323b;
    border-radius: 10px;
    margin-bottom: 20px;
    appearance: none;
    -webkit-appearance: none;
  }
  /* 計測中も「どの区間か」を読めるように薄くしすぎない（V16） */
  select:disabled { opacity: 0.75; }
  /* 区間の選択欄は、選択中チップと同じ白枠で「対」にする（V16） */
  #sectionSelect { box-shadow: 0 0 0 2px #ffffff; }
  /* タップ時に出るブラウザ標準のフォーカス枠を消す（白枠＝選択中、と紛らわしいため・V16） */
  select:focus { outline: none; }
  /* 名前と区間を半分ずつ横並びに（V16） */
  .field-row {
    display: flex;
    align-items: flex-end;  /* ラベルが2行になっても入力欄の高さを揃える */
    gap: 10px;
  }
  .field {
    min-width: 0;
  }
  /* 名前:区間 = 4:6（名前側が窮屈だったため3:7から戻した） */
  .field:nth-child(1) { flex: 4 1 0; }
  .field:nth-child(2) { flex: 6 1 0; }
  .display-row {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
    min-height: 56px;
  }
  .cart-lane {
    flex: 1;
    position: relative;
    align-self: stretch;
  }
  .display {
    font-size: 48px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffffff;
    line-height: 1;
  }
  .cart {
    position: absolute;
    top: 50%;
    left: 0;
    font-size: 30px;
    line-height: 1;
    visibility: hidden;
  }
  /* V20.0：選択中の区間をアイコンで視覚的に示す。
     グロサリ①②③・デイリー①②③は見た目がそっくりな文字ラベルの見間違いが実際に発生したため、
     「商品アイコン＋番号キャップ」で区別できるようにした。それ以外の区間は代表アイコン2つを
     並べて、グロサリ・デイリー側（アイコン＋番号）と横幅の見た目を揃える（正人さん案・2026-08-22）。
     フリーはアイコンなし。
     ★表示位置＝カート🛒アニメーションと全く同じ場所（.cart-lane内・top:50%/left:0の絶対配置）に
     重ねて置く。display-rowの新しいflex子要素として追加すると、停止中の「status」「経過時間」の
     位置が元のレイアウトからズレてしまう不具合が出たための修正（正人さんの指摘・2026-08-22）。
     計測中はbody.runningでこちらを隠し、カート側（.cart.active）に切り替わる。 */
  .section-icon {
    position: absolute;
    top: 50%;
    /* 計測時間に近すぎたため、カート🛒の可動域（left:0）ではなく余白の中央あたりに寄せる（正人さんの指摘） */
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 3px;
    line-height: 1;
  }
  body.running .section-icon { visibility: hidden; }
  /* アイコン本体と番号キャップの見た目の大きさが揃うように統一（52pxと34pxの平均から、さらに少し縮小・正人さんの指摘） */
  .section-icon .sec-icon-glyph,
  .section-icon .sec-icon-num {
    font-size: 36px;
    line-height: 1;
  }
  /* 行き1.4秒（空なので速い）＋右端で1.0秒停止（3個積み込む）＋帰り2.4秒（積んでいるのでゆっくり）
     ＝1サイクル4.8秒。行きと帰りで約1.7倍の速度差。「計測中」の明滅も同じ4.8秒で同期（V16.1） */
  .cart.active {
    visibility: visible;
    animation: roll 4.8s ease-in-out infinite;
  }
  @keyframes roll {
    0%       { left: 0;                 transform: translateY(-50%) scaleX(-1); }
    29.167%  { left: calc(100% - 34px); transform: translateY(-50%) scaleX(-1); } /* 1.4秒＝右端に到着 */
    29.18%   { left: calc(100% - 34px); transform: translateY(-50%) scaleX(1); }  /* 着いたら向きを変える */
    50%      { left: calc(100% - 34px); transform: translateY(-50%) scaleX(1); }  /* 1.0秒停止＝積み込み */
    100%     { left: 0;                 transform: translateY(-50%) scaleX(1); }  /* 2.4秒かけてゆっくり戻る */
  }
  /* カートに積む商品（V16.1・小松原さんの提案）
     行きは空、右端で商品を2個積んで帰ってくる（1往復＝3.6秒でカートの往復と同じサイクル）。
     ※商品が見えるのは必ず帰り道＝カートが反転していない区間なので、商品側で向きを
       打ち消す必要はない（行きは opacity:0 で隠れている） */
  .cart .load {
    position: absolute;
    top: 4px;
    font-size: 12px;
    line-height: 1;
    opacity: 0;
    pointer-events: none;
  }
  /* カゴからはみ出さないよう左寄せ（V16.1調整）。3個目は2個の上に載せて三角に積む */
  .cart .load1 { left: 4px; }
  .cart .load2 { left: 13px; }
  .cart .load3 { left: 8px; top: -3px; }
  /* カート本体を商品より前面に置くと「カゴの中に入っている」ように見える（V16.1） */
  .cart .glyph { position: relative; z-index: 2; }
  .cart .load  { z-index: 1; }
  .cart.active .load1 { animation: load1 4.8s linear infinite; }
  .cart.active .load2 { animation: load2 4.8s linear infinite; }
  .cart.active .load3 { animation: load3 4.8s linear infinite; }
  /* 1個目：カートが右端で止まった直後（1.45秒）に、18px上から0.55秒かけて落ちてくる */
  @keyframes load1 {
    0%,     30.0%  { opacity: 0; transform: translateY(-18px); }
    30.208%        { opacity: 1; transform: translateY(-18px); animation-timing-function: ease-in; }
    41.667%, 96.7% { opacity: 1; transform: translateY(0); }
    100%           { opacity: 0; transform: translateY(0); }
  }
  /* 2個目：1個目より 0.14秒おくれ（ズラすのがミソ） */
  @keyframes load2 {
    0%,     32.9%  { opacity: 0; transform: translateY(-18px); }
    33.125%        { opacity: 1; transform: translateY(-18px); animation-timing-function: ease-in; }
    44.583%, 96.7% { opacity: 1; transform: translateY(0); }
    100%           { opacity: 0; transform: translateY(0); }
  }
  /* 3個目：さらに0.14秒おくれて、下の2個の上（三角の頂点）に着地 */
  @keyframes load3 {
    0%,     35.8%  { opacity: 0; transform: translateY(-18px); }
    36.042%        { opacity: 1; transform: translateY(-18px); animation-timing-function: ease-in; }
    47.5%,  96.7%  { opacity: 1; transform: translateY(0); }
    100%           { opacity: 0; transform: translateY(0); }
  }
  /* 状態表示は計測時間の左横・上下センター（V16） */
  .status {
    flex: 1 1 0;
    min-width: 0;
    font-size: 20px;
    line-height: 1.35;
    text-align: center;
    color: #6fcf97;
  }
  .status.idle { color: #7a8794; }
  /* 計測中＝スタートボタンと同じ緑で、ゆっくり明滅させて「動いている」ことを伝える（V16） */
  body.running .status {
    color: #2f9e6a;
    animation: blink 4.8s ease-in-out infinite;
  }
  /* カートに完全同期（V16.1）。1往復＝呼吸ひとつ。
     左端でパッと点灯 → 空で行く1.4秒＋積み込みの1.0秒は点灯キープ（＝前半2.4秒） →
     荷物を積んで帰る2.4秒でゆっくり暗転 → 左端で荷降ろしと同時にまたパッと点灯 */
  @keyframes blink {
    0%,  50%  { opacity: 1; }
    94%, 100% { opacity: 0.15; }
  }
  .buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  button {
    flex: 1;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s;
    /* V19.12：長押し中にAndroid/iOSの「テキスト選択」メニューが出てしまうのを防ぐ
       （他の長押しUI＝記録クリア等では最初から設定済みだったが、スタート/ストップには
       付け忘れていた。指が少しズレただけでコピー選択が出てしまう不具合の原因・2026-08-20） */
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.35; cursor: default; }
  .btn-start { background: #2f9e6a; color: white; }
  .btn-stop { background: #d9534f; color: white; }
  /* V19.12：使っていない方のボタン（未計測中のストップ／計測中のスタート）を
     「長押しで再読み込み」に転用（タイトル長押し版から変更・iPhoneのPWAは下スワイプでの
     リロードが効かないため）。開始/停止と見分けやすいよう中立色にする */
  .btn-reload {
    position: relative;
    overflow: hidden;
    background: #2c3e52;
    color: white;
    font-size: 14px;
    white-space: nowrap;
  }
  /* V19.12：他の長押しUI（記録クリア・全員リセット・区間チップ）と同じ「塗りつぶしが伸びる」
     進捗表現に統一（当初はopacityで薄くするだけだったが、分かりにくいとの指摘で変更・2026-08-20） */
  .reload-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: #4a7fb5;
    z-index: 0;
  }
  .btn-reload.holding .reload-fill {
    width: 100%;
    transition: width 1s linear;
  }
  .reload-label {
    position: relative;
    z-index: 1;
  }
  /* V19.12：未送信件数を2行目に添えるとき、縦幅は変えず1行分の高さに収める
     （ボタン自体のpaddingを詰めて、2行分のテキストが元の1行ぶんの高さに収まるようにする） */
  .btn-reload-2line { padding: 8px 0; }
  .btn-reload-2line .reload-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
  }
  .btn-reload-main { font-size: 11px; line-height: 1.15; }
  .btn-reload-sub { font-size: 10px; line-height: 1.15; color: #ffd479; }
  /* V19.12：リロードが実際に効いたことを、画面上部のトーストではなく
     ボタン自身の文字を一瞬置き換える形で知らせる（トーストは気づきにくいとの指摘・2026-08-20） */
  .btn-reload-done { background: #2f9e6a; }
  /* V19.15：オフライン中に長押ししたときは、reload()を呼ばずボタン自身でその場に知らせる
     （回線が無いままreload()すると、PWAがERR_FAILEDの白画面になりアプリごと開き直す羽目になっていたため） */
  .btn-reload-offline { background: #6b5b1f; }
  .records {
    margin-top: 16px;
    background: #171c22;
    border-radius: 12px;
    overflow: hidden;
  }
  /* 記録クリアは記録一覧カードの下へ・長押しで発動（V16） */
  .clear-zone {
    padding: 14px 16px;
    display: flex;
    justify-content: center;
    border-top: 1px solid #232a33;
  }
  .btn-clear-all {
    position: relative;
    overflow: hidden;
    flex: none;
    width: auto;
    min-width: 220px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid #3a2a2a;
    border-radius: 10px;
    background: #1a1512;
    color: #b98a8a;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
  }
  .btn-clear-all .clear-label {
    position: relative;
    z-index: 1;
  }
  .btn-clear-all.holding .clear-label { color: #ffffff; }
  .clear-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: #d9534f;
    z-index: 0;
  }
  .btn-clear-all.holding .clear-fill {
    width: 100%;
    transition: width 1.4s linear;
  }
  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: #1d232b;
    font-size: 15px;
    color: #8fa0b3;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 18px;
  }
  th, td {
    padding: 11px 8px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid #232a33;
  }
  th { color: #7a8794; font-weight: 500; font-size: 14px; }
  td.num { color: #7a8794; width: 20px; font-size: 14px; }
  td.dur { font-variant-numeric: tabular-nums; color: #ffd479; text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .empty {
    text-align: center;
    padding: 24px;
    color: #5c6773;
    font-size: 15px;
  }
  .total {
    padding: 12px 16px;
    text-align: right;
    font-size: 15px;
    color: #9fb2c7;
    border-top: 1px solid #232a33;
  }
  .total b { color: #ffd479; font-variant-numeric: tabular-nums; font-size: 15px; }
  .section-status {
    background: #171c22;
    border-radius: 12px;
    padding: 14px 16px;
  }
  .section-status-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #8fa0b3;
    margin-bottom: 12px;
  }
  /* 自分がストップしたのに送信できていない区間＝他の人からは「計測中」のまま固まって見える区間 */
  .chip.pending {
    border-color: #ffd479;
    border-style: dashed;
  }
  .chip .pending-mark { color: #ffd479; }
  .section-hint {
    font-size: 13px;
    color: #5c6773;
    line-height: 1.5;
    margin-top: 14px;
    text-align: center;
  }
  .reset-zone {
    margin-top: 14px;
    display: flex;
    justify-content: center;
  }
  .btn-reset-all {
    position: relative;
    overflow: hidden;
    flex: none;
    width: auto;
    min-width: 220px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid #3a2a2a;
    border-radius: 10px;
    background: #1a1512;
    color: #b98a8a;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
  }
  .btn-reset-all .reset-label {
    position: relative;
    z-index: 1;
  }
  .btn-reset-all.holding .reset-label { color: #ffffff; }
  .reset-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: #d9534f;
    z-index: 0;
  }
  .btn-reset-all.holding .reset-fill {
    width: 100%;
    transition: width 1.4s linear;
  }
  .chips {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .chip {
    position: relative;
    overflow: hidden;
    font-size: clamp(13px, 4.4vw, 18px);
    padding: 8px 6px;
    text-align: center;
    white-space: nowrap;
    border-radius: 999px;
    background: #232a33;
    color: #c5d0dc;
    border: 1px solid #2a323b;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
  }
  .chip-label { position: relative; z-index: 1; }
  .chip-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: rgba(255,255,255,0.32);
    z-index: 0;
  }
  .chip.holding .chip-fill {
    width: 100%;
    transition: width 1.4s linear;
  }
  .chip.done, .chip.skip {
    background: #d9534f;
    color: #ffffff;
    border-color: #d9534f;
    font-weight: 600;
  }
  .chip.active {
    background: #2f9e6a;
    color: #ffffff;
    border-color: #2f9e6a;
    font-weight: 600;
  }
  /* いま選ばれている区間（タップで選択・V16）＝「区間を選ぶ」欄と同じ白枠で対にする */
  .chip.selected {
    box-shadow: 0 0 0 2px #ffffff;
  }
  .chip small {
    display: block;
    font-size: clamp(10px, 2.7vw, 12px);
    font-weight: 400;
    opacity: 0.9;
    margin-top: 2px;
  }

  /* ---- V18：メンバー間のコメント（チャット）---- */
  /* 新着バナー＝名前・区間の選択行 と 状態＋経過時間の間に配置（2026-08-10・正人さんと確定）
     スタート／ストップから離すことで誤タップを避ける狙い */
  .chat-banner {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 10px;
    background: #232a33;
    color: #8fa0b3;
    font-size: 14px;
    margin-bottom: 20px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }
  .chat-banner-icon { flex: none; }
  .chat-banner-text {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* 新着あり＝緑系（ページの背景が白でも暗くても、ピル自体が色を持つので読める） */
  .chat-banner.unread {
    background: #1d3a2c;
    color: #bfe8d3;
    font-weight: 600;
  }
  /* V19.10：チャットの未送信があるとき、バナー右端に⚠️（区間の状況の未送信バッジと同じ黄色） */
  .chat-banner-warn {
    flex: none;
    color: #ffd479;
    margin-left: 4px;
  }
  .chat-banner-warn[hidden] { display: none; }
  /* まだ送れていない自分のメッセージ＝既読バッジと同じ位置に黄色で表示（V19.10） */
  .chat-msg-pending {
    font-size: 13px;
    color: #ffd479;
    margin-top: 2px;
  }
  /* V20.1：未送信の長押し操作が「取消」→「リロード」に変わったので、その場で説明を添える */
  .chat-msg-pending-hint {
    color: #8fa0b3;
    margin-left: 4px;
  }
  .chat-overlay {
    position: fixed;
    inset: 0;
    background: #101418;
    z-index: 30;
    display: flex;
    flex-direction: column;
    overscroll-behavior: none;
  }
  .chat-overlay[hidden] { display: none; }
  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    /* iPhoneのステータスバー/ノッチと「← 計測に戻る」が重なりタップ不可になる不具合対策
       （2026-08-11・高橋さん/服部さんのiPhoneで発覚）。上だけセーフエリア分の余白を追加 */
    padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
    border-bottom: 1px solid #232a33;
  }
  .chat-back {
    flex: none;
    width: auto;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: 600;
    background: #2f9e6a;
    color: #ffffff;
    border-radius: 8px;
  }
  /* ストップ押し忘れ防止に、チャット画面にも「区間名 計測中 ◯分」を表示（Claudian提案） */
  .chat-elapsed {
    font-size: 14px;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
    text-align: center;
    line-height: 1.4;
  }
  /* 計測中は白でメインの状態表示より少し多めに点滅させる（メイン4.8秒より短い2.4秒周期） */
  .chat-elapsed.running {
    animation: blink 2.4s ease-in-out infinite;
  }
  /* 新着メッセージのプッシュ通知（V19）を許可するボタン。許可済みは控えめに、未許可は目立たせる */
  .notif-btn {
    flex: none;
    width: auto;
    padding: 8px 12px;
    font-size: 12px;
    border-radius: 8px;
    border: 1px solid #2a323b;
    background: #1d232b;
    color: #8fa0b3;
  }
  .notif-btn.on {
    background: #17301f;
    color: #7fd39a;
    border-color: #2f9e6a;
  }
  .notif-btn.unsupported { display: none; }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .chat-msg {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }
  .chat-msg.mine { align-self: flex-end; align-items: flex-end; }
  .chat-msg.other { align-self: flex-start; align-items: flex-start; }
  .chat-msg-meta {
    font-size: 13px;
    color: #ffffff;
    margin-bottom: 4px;
  }
  .chat-msg-to {
    color: #ffffff;
    margin-left: 4px;
  }
  .chat-msg-bubble {
    position: relative;
    overflow: hidden;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 15px;
    line-height: 1.4;
    word-break: break-word;
    background: #232a33;
    color: #eaeef2;
  }
  .chat-msg.mine .chat-msg-bubble {
    background: #2f9e6a;
    color: #ffffff;
  }
  /* 自分宛メンションの吹き出しは白背景・黒文字で強調（2026-08-10・白枠から変更） */
  .chat-msg.mention .chat-msg-bubble {
    background: #ffffff;
    color: #000000;
  }
  /* 自分の吹き出しは長押しで削除できる（2026-08-10）。スワイプ阻害を避けるため touch-action: pan-y */
  .chat-msg.mine .chat-msg-bubble {
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
  }
  .chat-msg-text { position: relative; z-index: 1; }
  .chat-msg-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: rgba(0,0,0,0.28);
    z-index: 0;
  }
  .chat-msg-bubble.holding .chat-msg-fill {
    width: 100%;
    transition: width 1.0s linear;
  }
  .chat-hint {
    font-size: 12px;
    color: #5c6773;
    text-align: center;
    margin-bottom: 10px;
  }
  /* 既読件数バッジ（送信者本人を除いた人数）※名前と同じ文字サイズ・色に揃える */
  .chat-msg-read {
    font-size: 13px;
    color: #ffffff;
    margin-top: 2px;
  }
  .chat-empty {
    text-align: center;
    color: #5c6773;
    font-size: 14px;
    margin-top: 40px;
  }
  .chat-input-area {
    padding: 12px 16px 20px;
    border-top: 1px solid #232a33;
  }
  .chat-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .chat-input-row:last-child { margin-bottom: 0; }
  .chat-input-row select,
  .chat-input-row input[type="text"] {
    margin-bottom: 0;
  }
  /* 宛先：区間（V20.1で追加）：定型文 の3並び。
     宛先＝「小松原」、区間＝「水産・畜産」がちょうど収まる幅に固定し、
     残りを定型文が伸縮して埋める（正人さんの依頼・2026-08-25＝区間の文字が見切れていた対策） */
  #chatToSelect { flex: 0 0 80px; width: 80px; padding-left: 8px; padding-right: 8px; }
  #chatSectionSelect { flex: 0 0 110px; width: 110px; padding-left: 8px; padding-right: 8px; }
  #chatPresetSelect { flex: 1 1 auto; min-width: 0; }
  #chatFreeInput { flex: 1 1 0; }
  #chatSendBtn {
    flex: none;
    width: auto;
    padding: 12px 18px;
    background: #2f9e6a;
    color: #fff;
  }
</style>
</head>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script>
  let running = false;
  let startTime = null;
  let currentSection = '';
  let rafId = null;
  let records = [];
  let sharedStatus = {};
  let db = null;
  let chipHolding = false;
  let pendingRender = false;

  const sectionSelect = document.getElementById('sectionSelect');
  const display = document.getElementById('display');
  const cart = document.getElementById('cart');
  const status = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const clearBtn = document.getElementById('clearBtn');
  const tableWrap = document.getElementById('tableWrap');
  const emptyMsg = document.getElementById('emptyMsg');
  const countEl = document.getElementById('count');
  const totalRow = document.getElementById('totalRow');
  const totalTimeEl = document.getElementById('totalTime');
  const sectionListEl = document.getElementById('sectionList');
  const userNameEl = document.getElementById('userName');
  const resetAllBtn = document.getElementById('resetAllBtn');
  const sectionIconEl = document.getElementById('sectionIcon');

  // ---- V20.0：選択中の区間をアイコンで表示（グロサリ①②③・デイリー①②③の見間違い対策）----
  // グロサリ・デイリーは実際の商品（菓子/飲料/調味料、豆腐/牛乳/アイス）でアイコンを分け、
  // 番号キャップ（1️⃣2️⃣3️⃣）も添えて二重に判別できるようにする。それ以外の区間は代表アイコン2つを
  // 並べて横幅の見た目を揃える（正人さん案）。フリーはアイコンなし。
  const SECTION_ICONS = {
    '農産': ['🥬', '🍎'],
    '水産・畜産': ['🐟', '🥩'],
    'デリカ': ['🍙', '🍱'],
    'グロサリ①': ['🍘', '①'],
    'グロサリ②': ['🍹', '②'],
    'グロサリ③': ['🧂', '③'],
    'デイリー①': ['🍥', '①'],
    'デイリー②': ['🥛', '②'],
    'デイリー③': ['🍧', '③'],
    'デリコン': ['🧻', '🧴'],
    'リカー': ['🍺', '🍷'],
    'ケース': ['📦', '📦'],
    'その他': ['💊', '💐'],
    '衣料・住余': ['👕', '🧦'],
    // フリーはアイコンなし（キーを持たせず、下のupdateSectionIcon()で空表示になる）
  };
  function updateSectionIcon() {
    if (!sectionIconEl) return;
    const pair = SECTION_ICONS[sectionSelect.value];
    if (!pair) { sectionIconEl.innerHTML = ''; return; }
    sectionIconEl.innerHTML =
      `<span class="sec-icon-glyph">${pair[0]}</span><span class="sec-icon-num">${pair[1]}</span>`;
  }

  // 前回選んだ名前を端末に覚えておき、次回起動時も自動で選択する（触らないと先頭の「平野」になってしまい、
  // 通知トークンの名前とズレる事故につながっていたため。2026-08-12）
  const USER_NAME_KEY = 'nespaPT_userName';
  try {
    const savedName = localStorage.getItem(USER_NAME_KEY);
    if (savedName && [...userNameEl.options].some(o => o.value === savedName)) {
      userNameEl.value = savedName;
    }
  } catch (e) {}
  userNameEl.addEventListener('change', () => {
    try { localStorage.setItem(USER_NAME_KEY, userNameEl.value); } catch (e) {}
  });

  // ---- カートに積む商品（V16.1）----
  // 1往復（4.8秒）につき必ず3個（下2個＋上1個の三角積み）。組み合わせは1往復ごとに次の3つへ。
  // 切り替わるのは左端＝どれも見えていない瞬間なので、入れ替わるところは見えない。
  // 並びは売場の順（農産→水産→畜産→デリカ→グロサリ→デイリー→リカー）
  const cartLoads = [
    document.getElementById('cartLoad1'),
    document.getElementById('cartLoad2'),
    document.getElementById('cartLoad3')
  ];
  const LOAD_ITEMS = ['🍎', '🥬', '🐟', '🥩', '🍱', '🍞', '🧃', '🥛', '🥚', '🍺'];
  let loadIndex = 0;
  if (cartLoads.every(Boolean)) {
    const applyLoadItems = () => {
      cartLoads.forEach((el, i) => {
        el.textContent = LOAD_ITEMS[(loadIndex + i) % LOAD_ITEMS.length];
      });
    };
    applyLoadItems();
    // load1（4.8秒サイクル）が1周するたび＝左端で荷物が空になった瞬間に次の3つへ
    cartLoads[0].addEventListener('animationiteration', () => {
      loadIndex = (loadIndex + 3) % LOAD_ITEMS.length;
      applyLoadItems();
    });
  }

  // ---- V19.5：未送信キュー（回線が不安定でも記録を落とさないための保険）----
  // Firebaseは通信が切れても書き込みをキューして再接続時に送ってくれるが、そのキューは「メモリの中」にしかない。
  // スマホがアプリを裏に回してプロセスごと落とすと、送れていない書き込みは丸ごと消える（2026-08-13に実際に発生）。
  // → 送る前にlocalStorageへ「未送信」の控えを残し、送信が成功したら消す。残っていれば後で自動的に再送する。
  const OUTBOX_KEY = 'nespaPT_outbox';
  // ★logsとstatusで再送のルールを変える。
  //   logs（実績そのもの）＝何日経っても送る価値がある。同じキーに上書きするだけなので重複しない。
  //   status（区間の共有状態）＝「今どうなっているか」の情報。時間が経ってから送ると、その間に別の人が
  //   始めた計測を消してしまう。だから古くなったら送るのを諦める。
  const STATUS_STALE_MS = 10 * 60 * 1000;
  let outbox = [];
  // ★V19.7で追加＝「今オンラインだと確実に分かっているか」の自前フラグ。
  // .set()は呼んだ瞬間にFirebase自身がその配達を引き受けてしまい、オフライン中に呼んでも
  // SDKの内部キューに積まれて、後で"私のチェックを一切通さずに"自動で配達されてしまう
  // （2026-08-13〜14、多人数シナリオの実機テストで発覚＝送る直前の確認だけでは守れなかった）。
  // → オフラインだと分かっている間は.set()/.remove()自体を呼ばない。オンラインだと確実に
  //   分かってから初めて呼ぶことで、書く瞬間には必ずこちらのチェックを通すようにする。
  let isConnected = navigator.onLine;

  function loadOutbox() {
    try {
      const raw = localStorage.getItem(OUTBOX_KEY);
      outbox = raw ? (JSON.parse(raw) || []) : [];
    } catch (e) { outbox = []; }
  }
  function saveOutbox() {
    try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(outbox)); } catch (e) {}
  }
  function outboxGet(id) { return outbox.find(x => x.id === id) || null; }
  function outboxPut(entry) {
    // 同じidが既にあれば置き換える（statusは最新の状態だけ送れば十分なので積み上げない）
    const i = outbox.findIndex(x => x.id === entry.id);
    if (i >= 0) outbox[i] = entry; else outbox.push(entry);
    saveOutbox();
    updateOutboxUi();
  }
  function outboxRemove(id) {
    const i = outbox.findIndex(x => x.id === id);
    if (i >= 0) { outbox.splice(i, 1); saveOutbox(); updateOutboxUi(); }
  }

  // ---- V19.9：送信に失敗した理由をこっそりFirebaseへ記録（メンバーには見えない・Claudianが確認する用）----
  // 「回線は繋がってそうなのに未送信が出る」原因を探るため、失敗の中身だけ残す。
  // これ自体が失敗しても無視する（デバッグ用の記録が本来の動作を邪魔しないように）。
  function logSendFailure(entry, err) {
    if (!db) return;
    try {
      db.ref('debugLog').push({
        at: Date.now(),
        clock: formatClock(new Date()),
        name: getUserName() || '不明',
        kind: entry.kind,
        path: entry.path,
        error: err ? String(err.message || err) : '不明なエラー',
        online: navigator.onLine,
        isConnected: isConnected
      }).catch(() => {});
    } catch (e) {}
  }

  // 1件送る。成功したらキューから消す。失敗したら残す（次の機会に再送される）
  function trySend(entry) {
    if (!db || !entry) return Promise.resolve(false);
    if (entry.kind === 'status' || entry.kind === 'status-remove') {
      if (Date.now() - entry.at > STATUS_STALE_MS) { outboxRemove(entry.id); return Promise.resolve(false); }
      // ★V19.8：once('value')→set() の2段階をやめ、transaction() に変更。
      // 守るべきは「相手が"今まさに計測中"のときだけ」（by不一致だけで弾くとV19.6で見た別の誤爆＝
      // 完了済み区間に新しく計測を始めようとした人まで弾いてしまう問題を起こすので、state==='active'限定）。
      // ★once('value')だと、再接続した"その瞬間"はまだローカルの古いキャッシュしか同期できておらず、
      // 相手の書き込みを見落として上書きしてしまうことが2026-08-13/14の実機テストで繰り返し発覚した。
      // transaction()はサーバー側が持つ本当に最新の値を使って毎回判定し直してくれる
      // （ズレていたら自動でやり直す）ため、この「再接続直後の一瞬」にも強い。
      const me = entry.data ? entry.data.by : entry.by;
      const newValue = entry.kind === 'status-remove' ? null : entry.data;
      return db.ref(entry.path).transaction((cur) => {
        if (cur && cur.state === 'active' && cur.by && cur.by !== me) return; // undefined=中断（書き換えない）
        return newValue; // nullを返すと削除＝取消(status-remove)と同じ効果
      }).then((result) => {
        outboxRemove(entry.id);
        return !!result.committed;
      }).catch((err) => { logSendFailure(entry, err); return false; });
    }
    // logs＝pushで作ったキーに向けて書くので、何度送っても同じ場所に上書きされるだけ（重複しない）
    return db.ref(entry.path).set(entry.data)
      .then(() => { outboxRemove(entry.id); return true; })
      .catch((err) => { logSendFailure(entry, err); return false; });
  }

  function flushOutbox() {
    // ★オンラインだと確実に分かっているときだけ試みる（isConnectedがまだ未確定/falseなら何もしない）。
    // ここで妥協してオフラインのまま.set()を呼んでしまうと、SDKの内部キューに積まれて
    // 冒頭のコメント通りの事故が起きる。
    if (!db || !isConnected || outbox.length === 0) return;
    outbox.slice().forEach(entry => { trySend(entry); });
  }

  const CHIP_HOLD_MS = 1400;

  // 記録一覧から、その区間の「一番新しい1件」を削除する
  function removeLatestRecord(section) {

  function applyChipLongPress(section, state) {

      if (state === 'done') removeLatestRecord(section);

    if (Math.abs(e.clientX - chipHoldStartX) > 8 || Math.abs(e.clientY - chipHoldStartY) > 8) {
      chipTapCandidate = false;

  function formatDuration(ms) {
    return Math.floor(ms / 60000) + '分';

  function formatClock(date) {
    return String(date.getHours()).padStart(2,'0') + ':' +
           String(date.getMinutes()).padStart(2,'0');
  }

  // ---- V17：記録の蓄積（分析用にログを貯める）----
  // メンバーから見える動きはゼロ。ストップを押した瞬間に、開始・終了の生の時刻（ms）を
  // logs/{YYYY-MM-DD}/{自動ID} にこっそり1件書くだけ。表示・操作は一切変えない。
  function formatDateStr(date) {
    return date.getFullYear() + '-' +
           String(date.getMonth()+1).padStart(2,'0') + '-' +
           String(date.getDate()).padStart(2,'0');
  }
  // 開始した日付を基準にする（日をまたいで計測することは想定しない）
  function writeLog(section, name, startMs, endMs) {
    if (!db) return null;
    const logDate = formatDateStr(new Date(startMs));
    try {
      // push()はキーを端末側だけで作れる（通信不要）。先にキーを確保しておくことで、
      // 何度再送しても同じ場所に書くことになり、記録が重複しない（V19.5）
      const ref = db.ref('logs/' + logDate).push();
      const data = {
        区間: section,
        名前: name || 'ゲスト',
        開始: startMs,
        終了: endMs,
        取消: false
      };
      // ★送る前に控えを残す。送信が成功したときだけ消える。
      // 実際に送るかどうかは flushOutbox() の isConnected 判定に任せる（オフライン中に.set()を呼ばないため）
      const entry = { id: 'log:' + logDate + '/' + ref.key, kind: 'log', path: 'logs/' + logDate + '/' + ref.key, data, at: Date.now() };
      outboxPut(entry);
      flushOutbox();
      return { logDate, logId: ref.key };
    } catch (e) { return null; }
  }
  // V14の「完了の取消」に連動して、蓄積ログ側は削除せず「取消済み」の印を立てる
  function markLogCancelled(rec) {
    if (!db || !rec || !rec.logDate || !rec.logId) return;
    const id = 'log:' + rec.logDate + '/' + rec.logId;
    const pending = outboxGet(id);
    if (pending) {
      // ★まだ送れていないログなら、キューの中身自体を「取消済み」に書き換える（V19.5）。
      //   ここで取消だけ別に送ってしまうと、あとからログ本体が再送されたときに 取消:false で
      //   丸ごと上書きされ、取り消したはずの記録が復活してしまう。
      pending.data.取消 = true;
      pending.at = Date.now();
      outboxPut(pending);
      flushOutbox();
      return;
    }
    try { db.ref('logs/' + rec.logDate + '/' + rec.logId).update({ 取消: true }); } catch (e) {}
  }

  // 区間の共有状態（status）の書き込み。スタート・ストップ・復元の3箇所から使う（V19.5で共通化）

      path,

  function removeStatus(section) {

  function renderSections() {

    if (chipHolding) { pendingRender = true; return; }
    pendingRender = false;
    let html = '';
    Array.from(sectionSelect.options).forEach(opt => {
      const info = sharedStatus[fbKey(opt.value)];
      let cls = '';
      let meta = '';
      if (info) {
        const state = info.state || 'done';
        const who = info.by ? escapeHtml(info.by) : '';
        const when = info.at ? escapeHtml(info.at) : '';
        if (state === 'active') {
          cls = ' active';
          const parts = [who, '計測中'].filter(Boolean).join(' ');
          meta = `<small>${parts}</small>`;
        } else if (state === 'skip') {
          cls = ' skip';
          const parts = ['注文なし', who].filter(Boolean).join(' ');
          meta = `<small>${parts}</small>`;
        } else {
          cls = ' done';
          const parts = [who, when].filter(Boolean).join(' ');
          if (parts) meta = `<small>${parts}</small>`;
        }

      // V19.5：自分の書き込みがまだ送れていない区間には点線枠と印を出す。
      // 「ストップしたのに他の人からは計測中のまま見えている」状態を、その場で気づけるようにするため。
      const pend = pendingStatusEntry(opt.value);

        cls += ' pending';
        let what = '状態';
        if (pend.kind === 'status-remove') what = '取消';
        else if (pend.data && pend.data.state === 'done') what = '完了';
        else if (pend.data && pend.data.state === 'active') what = '計測中';
        else if (pend.data && pend.data.state === 'skip') what = '注文なし';
        meta = `<small><span class="pending-mark">⚠️${what}が未送信</span></small>`;

    });

  stopBtn.addEventListener('click', () => {
    // 計測前はこのボタンは「長押しでリロード」役に転用されている（V19.12）。
    // running===falseのときは元々このreturnで弾かれる＝通常のクリックでは何もしない
    if (!running) return;
    running = false;
    clearActive();
    cancelAnimationFrame(rafId);
    cart.classList.remove('active');
    document.body.classList.remove('running');
    const endTime = Date.now();
    const durationMs = endTime - startTime;
    const logRef = writeLog(currentSection, getUserName(), startTime, endTime);
    records.push({
      section: currentSection,
      startStr: formatClock(new Date(startTime)),
      endStr: formatClock(new Date(endTime)),
      durationMs,
      logDate: logRef ? logRef.logDate : null,
      logId: logRef ? logRef.logId : null
    });
    saveRecords();
    display.textContent = formatDuration(durationMs);
    status.textContent = '停止中';
    status.classList.add('idle');
    sectionSelect.disabled = false;
    userNameEl.disabled = false;
    updateReloadButton();
    clearBtn.disabled = false;
    writeStatus(currentSection, 'done', endTime);
    updateTable();
  });

  // ---- 記録クリアも「長押し」で発動（誤タップ防止・V16）----
  const CLEAR_HOLD_MS = 1400;
  let clearHoldTimer = null;
  let clearHoldStartX = 0;
  let clearHoldStartY = 0;

  function doClearRecords() {
    records = [];
    saveRecords();
    display.textContent = '0分';
    updateTable();
  }
  function startClearHold(e) {
    if (clearHoldTimer) return;
    clearHoldStartX = e ? e.clientX : 0;
    clearHoldStartY = e ? e.clientY : 0;
    clearBtn.classList.add('holding');
    clearHoldTimer = setTimeout(() => {
      clearHoldTimer = null;
      clearBtn.classList.remove('holding');
      if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
      doClearRecords();
    }, CLEAR_HOLD_MS);
  }
  function cancelClearHold() {
    if (clearHoldTimer) { clearTimeout(clearHoldTimer); clearHoldTimer = null; }
    clearBtn.classList.remove('holding');
  }
  function onClearMove(e) {
    if (!clearHoldTimer) return;
    if (Math.abs(e.clientX - clearHoldStartX) > 8 || Math.abs(e.clientY - clearHoldStartY) > 8) {
      cancelClearHold();
    }
  }
  clearBtn.addEventListener('pointerdown', startClearHold);
  clearBtn.addEventListener('pointermove', onClearMove);
  clearBtn.addEventListener('pointerup', cancelClearHold);
  clearBtn.addEventListener('pointerleave', cancelClearHold);
  clearBtn.addEventListener('pointercancel', cancelClearHold);
  window.addEventListener('scroll', cancelClearHold, { passive: true });
  // クリックそのものでは何も起こさない（保険）
  clearBtn.addEventListener('click', (e) => { e.preventDefault(); });

  // ---- V19.12：使っていない方のスタート/ストップボタンを「長押しでリロード」に転用 ----
  // きっかけ＝iPhoneのPWA（ホーム画面起動）は下スワイプでのリロードが効かないため。
  // 計測前はストップ側が、計測中はスタート側がどうせ使われていないので、そこをリロードに変える
  // （正人さんの発案・2026-08-20。将来的にタイトルを無くすレイアウトも見据えて、専用のヒント表示を
  // 増やさずに済む形にした）。「動いたら中止」の作法は他の長押しUIと同じだが、
  // リロードは早めに反応してほしいとのことで長さだけ1秒に短縮（他は1.4秒のまま・2026-08-20）。
  const RELOAD_HOLD_MS = 1000;
  const RELOAD_TOAST_KEY = 'nespaPT_reloadToast';
  function setupReloadHold(btn) {
    let holdTimer = null;
    let startX = 0, startY = 0;
    const start = (e) => {
      if (!btn.classList.contains('btn-reload') || holdTimer) return;
      startX = e ? e.clientX : 0;
      startY = e ? e.clientY : 0;
      btn.classList.add('holding');
      holdTimer = setTimeout(() => {
        holdTimer = null;
        // ★V19.15：オフライン中にreload()すると、キャッシュ経由でも読み込みに失敗しERR_FAILEDの
        // 真っ白画面になり、アプリごと開き直す羽目になる不具合が発生（2026-08-21・正人さんの実機報告）。
        // 「回線が繋がっているときだけ実際にリロードする」に変更し、オフラインならボタン上に
        // その場でメッセージを出すだけにして、reload()自体を呼ばないようにする。
        if (!navigator.onLine) {
          if (navigator.vibrate) { try { navigator.vibrate([30, 60, 30]); } catch (e) {} }
          btn.classList.add('btn-reload-offline');
          // ★オフラインの案内は常に2行になるため、未送信0件（＝1行モードのまま）だと
          // ボタンの縦幅がその瞬間だけ伸びてしまう不具合が発生（2026-08-21・正人さんの実機報告）。
          // 未送信件数に関係なく、表示中だけ強制的に2行モード（詰めた余白）にする。
          btn.classList.add('btn-reload-2line');
          const label = btn.querySelector('.reload-label');
          if (label) label.innerHTML = '📵オフラインです<br><span class="btn-reload-sub">つながったら再度お試しください</span>';
          setTimeout(() => {
            btn.classList.remove('btn-reload-offline');
            updateReloadButton(); // 2line判定も未送信件数に応じて元通りに再計算される
          }, 1800);
          return;
        }
        if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
        // ★リロード自体はPWAのキャッシュから一瞬で終わり、状態もJSが元通り復元するため、
        // 「本当にリロードされたか」が目で見て分からない（2026-08-20・正人さんの指摘）。
        // 次の起動時にこのボタンの文字を一瞬「✅更新しました」に変えるための目印を残してから
        // 再読み込みする（RELOAD_TOAST_KEY）。
        try { sessionStorage.setItem(RELOAD_TOAST_KEY, '1'); } catch (e) {}
        location.reload();
      }, RELOAD_HOLD_MS);
    };
    const cancel = () => {
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      btn.classList.remove('holding');
    };
    const onMove = (e) => {
      if (!holdTimer) return;
      if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) cancel();
    };
    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointermove', onMove);
    btn.addEventListener('pointerup', cancel);
    btn.addEventListener('pointerleave', cancel);
    btn.addEventListener('pointercancel', cancel);
    window.addEventListener('scroll', cancel, { passive: true });
  }
  setupReloadHold(startBtn);
  setupReloadHold(stopBtn);

  // 計測中かどうかに応じて、使っていない方を「🔄再読み込み」表示に切り替える。
  // V19.12：未送信件数（旧・区間の状況バッジ）もここに統合し、あれば2行目に添える
  // （正人さんの依頼・2026-08-20＝見出し行のバッジが折り返してレイアウトが崩れる問題への対処）。
  function updateReloadButton() {
    const sectionCount = outbox.filter(e => e.kind !== 'chat').length;
    // .reload-fill＝長押し中に伸びる塗りつぶし（他の長押しUIと同じ表現）。.reload-label＝
    // 塗りつぶしの上に乗る文字（z-indexで前面に固定）。
    const labelInner = sectionCount > 0
      ? '<span class="btn-reload-main">🔄長押しで更新</span><span class="btn-reload-sub">未送信' + sectionCount + '件</span>'
      : '🔄長押しで更新';
    const reloadHtml = '<span class="reload-fill"></span><span class="reload-label">' + labelInner + '</span>';
    if (running) {
      startBtn.innerHTML = reloadHtml;
      startBtn.classList.add('btn-reload');
      startBtn.classList.toggle('btn-reload-2line', sectionCount > 0);
      startBtn.disabled = false;
      stopBtn.textContent = 'ストップ';
      stopBtn.classList.remove('btn-reload', 'btn-reload-2line');
    } else {
      stopBtn.innerHTML = reloadHtml;
      stopBtn.classList.add('btn-reload');
      stopBtn.classList.toggle('btn-reload-2line', sectionCount > 0);
      stopBtn.disabled = false;
      startBtn.textContent = 'スタート';
      startBtn.classList.remove('btn-reload', 'btn-reload-2line');
    }
  }

  // ---- V18：メンバー間のコメント（チャット）----
  // データは messages/{自動ID} にフラットに保存（push key が時系列順に文字列比較できるので
  // それを既読管理にそのまま使う）。全体のお知らせ欄＝A案（正人さんと合意ずみ）。
  const chatBanner = document.getElementById('chatBanner');
  const chatBannerText = document.getElementById('chatBannerText');
  const chatBannerWarn = document.getElementById('chatBannerWarn');
  const chatOverlay = document.getElementById('chatOverlay');
  const chatBackBtn = document.getElementById('chatBackBtn');
  const chatElapsedEl = document.getElementById('chatElapsed');
  const chatMessagesEl = document.getElementById('chatMessages');
  const chatEmptyEl = document.getElementById('chatEmpty');
  const chatToSelect = document.getElementById('chatToSelect');
  const chatSectionSelect = document.getElementById('chatSectionSelect');
  const chatPresetSelect = document.getElementById('chatPresetSelect');
  const chatFreeInput = document.getElementById('chatFreeInput');
  const chatSendBtn = document.getElementById('chatSendBtn');
  const notifBtn = document.getElementById('notifBtn');

  let chatMessages = [];   // 古い順に並べて保持（[{key, text, name, to, time}, ...]）
  let chatOpen = false;
  const CHAT_READ_KEY = 'nespaPT_chatLastRead';
  // V20.2：チャットの未送信メッセージを長押しリロードしたとき、計測画面に戻ってしまうと
  // 「チャットを見ていたのに」となるため、リロード直前に目印を残しておき、起動時にチャットへ
  // 自動で戻す（正人さんの実機報告・2026-08-25）。
  const CHAT_REOPEN_KEY = 'nespaPT_chatReopen';

  function getChatLastRead() {
    try { return localStorage.getItem(CHAT_READ_KEY) || ''; } catch (e) { return ''; }
  }
  function setChatLastRead(key) {
    try { localStorage.setItem(CHAT_READ_KEY, key); } catch (e) {}
  }

  // V19.10：まだFirebaseに送れていない自分のチャットメッセージ（outboxの'chat'種別）
  function pendingChatEntries() {
    return outbox.filter(e => e.kind === 'chat');
  }

  // Firebaseから届いた確定分(chatMessages)に、outboxにだけあるまだ未送信の分をマージして
  // 表示用の1本のリストにする。
  // ★V19.10改：pendingかどうかは「outboxにまだ残っているか」だけで判定する（バッジ類と同じ基準に統一）。
  // Firebaseはローカルでは書き込みを先んじて反映してくれるため、chatMessages側には早々に
  // 出てきてしまうが、それだけで「未送信」表示を消すとバッジ（サーバーに届いた確認待ち）と
  // タイミングがズレる。→ 表示・バッジどちらも同じ「outboxに残っているか」で揃える。
  function mergedChatMessages() {
    const pendingKeys = new Set(pendingChatEntries().map(e => e.chatKey));
    const confirmed = chatMessages.map(m => pendingKeys.has(m.key) ? Object.assign({}, m, { pending: true }) : m);
    // Firebase側の一覧にまだ出てきていない分（オフライン中に作ったばかり等）はoutboxから補って表示
    const notYetListed = pendingChatEntries()
      .filter(e => !chatMessages.some(m => m.key === e.chatKey))
      .map(e => Object.assign({ key: e.chatKey, pending: true }, e.data));
    return confirmed.concat(notYetListed).sort((a, b) => (a.key < b.key ? -1 : 1));
  }

  function renderChatBanner() {
    const lastRead = getChatLastRead();
    const unread = chatMessages.filter(m => m.key > lastRead);
    const pendingCount = pendingChatEntries().length;
    if (chatBannerWarn) chatBannerWarn.hidden = pendingCount === 0;
    if (unread.length === 0) {
      chatBanner.className = 'chat-banner';
      chatBannerText.textContent = 'チャット';
      return;
    }
    const latest = unread[unread.length - 1];
    const preview = (latest.name || '?') + (latest.to ? '→' + latest.to : '') + '：' + latest.text;
    // バナーの色は宛先に関わらず一律で緑（2026-08-10・色分けは廃止してシンプルに）
    chatBanner.className = 'chat-banner unread';
    chatBannerText.textContent = preview + '（' + unread.length + '件）';
  }

  function renderChatMessages() {
    const merged = mergedChatMessages();
    if (merged.length === 0) {
      chatMessagesEl.innerHTML = '';
      chatMessagesEl.appendChild(chatEmptyEl);
      return;
    }
    const myName = getUserName();
    let html = '';
    merged.forEach(m => {
      const mine = m.name === myName;
      const mentionToMe = !!(m.to && m.to === myName);
      const cls = 'chat-msg ' + (mine ? 'mine' : 'other') + (mentionToMe ? ' mention' : '');
      const toTag = m.to ? `<span class="chat-msg-to">→${escapeHtml(m.to)}</span>` : '';
      const timeStr = m.time ? formatClock(new Date(m.time)) : '';
      // 自分の吹き出しだけ data-key を持たせ、長押しで削除（未送信なら送信取り消し）できるようにする（2026-08-10／V19.10）
      const bubble = mine
        ? `<div class="chat-msg-bubble" data-key="${escapeHtml(m.key)}"><span class="chat-msg-fill"></span><span class="chat-msg-text">${escapeHtml(m.text)}</span></div>`
        : `<div class="chat-msg-bubble">${escapeHtml(m.text)}</div>`;
      // 未送信中は既読バッジと同じ位置に「未送信」を表示（V19.10）。既読は送信が確定してから初めて付くもの。
      const readers = m.readBy ? Object.keys(m.readBy).filter(n => n !== m.name) : [];
      const statusBadge = m.pending
        ? `<div class="chat-msg-pending">⚠️ 未送信<span class="chat-msg-pending-hint">（長押しでリロードして再送信）</span></div>`
        : (readers.length ? `<div class="chat-msg-read">既読 ${readers.length}</div>` : '');
      html += `<div class="${cls}">
        <div class="chat-msg-meta">${escapeHtml(m.name || '?')} ${timeStr}${toTag}</div>
        ${bubble}
        ${statusBadge}
      </div>`;
    });
    chatMessagesEl.innerHTML = html;
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  // ---- 自分の吹き出しを長押しで削除（2026-08-10）----
  const MSG_HOLD_MS = 1000;
  let msgHoldTimer = null;
  let msgHoldEl = null;
  let msgHoldStartX = 0;
  let msgHoldStartY = 0;

  // 送信済みのメッセージを長押しした場合は今までどおりFirebase側の記録を削除する。
  // ★V20.1：未送信中（outboxに残っている）の長押しは「取消」ではなく「リロードして再送信」に変更
  // （正人さんの依頼・2026-08-25＝計測画面の長押しリロードボタンと同じ考え方。リロードすれば
  // 起動時のisConnectedチェック経由でoutboxの再送も自動的に試みられるため）。
  function deleteChatMessage(key) {
    if (!key || !db) return;
    try { db.ref('messages/' + key).remove(); } catch (e) {}
  }
  // 計測画面の setupReloadHold() と同じ「オフラインなら reload() 自体を呼ばず、一時的に案内を出す」
  // 作法をチャットの吹き出しにも適用する（オフライン中の reload() は ERR_FAILED の原因になるため＝V19.15の教訓）。
  function reloadForResend(bubble) {
    const pendingEl = bubble.parentElement && bubble.parentElement.querySelector('.chat-msg-pending');
    if (!navigator.onLine) {
      if (navigator.vibrate) { try { navigator.vibrate([30, 60, 30]); } catch (e) {} }
      if (pendingEl) {
        const original = pendingEl.innerHTML;
        pendingEl.innerHTML = '📵オフラインです<span class="chat-msg-pending-hint">再度お試しください</span>';
        setTimeout(() => { if (pendingEl.isConnected) pendingEl.innerHTML = original; }, 1800);
      }
      return;
    }
    if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
    // チャット画面を開いた状態でリロードしたので、起動後もチャットへ戻す目印を残す
    try { sessionStorage.setItem(CHAT_REOPEN_KEY, '1'); } catch (e) {}
    location.reload();
  }
  function startMsgHold(e) {
    const bubble = e.target.closest('.chat-msg-bubble');
    if (!bubble || !bubble.hasAttribute('data-key')) return;  // 自分の吹き出し以外は何もしない
    msgHoldStartX = e.clientX;
    msgHoldStartY = e.clientY;
    msgHoldEl = bubble;
    bubble.classList.add('holding');
    msgHoldTimer = setTimeout(() => {
      msgHoldTimer = null;
      bubble.classList.remove('holding');
      const key = bubble.getAttribute('data-key');
      if (outboxGet('chat:' + key)) {
        reloadForResend(bubble);
      } else {
        if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
        deleteChatMessage(key);
      }
      msgHoldEl = null;
    }, MSG_HOLD_MS);
  }
  function cancelMsgHold() {
    if (msgHoldTimer) { clearTimeout(msgHoldTimer); msgHoldTimer = null; }
    if (msgHoldEl) msgHoldEl.classList.remove('holding');
    msgHoldEl = null;
  }
  function onMsgMove(e) {
    if (!msgHoldEl) return;
    // 指が動いたらスクロールとみなして長押しを中止（他の長押しUIと同じ作法）
    if (Math.abs(e.clientX - msgHoldStartX) > 8 || Math.abs(e.clientY - msgHoldStartY) > 8) {
      cancelMsgHold();
    }
  }
  chatMessagesEl.addEventListener('pointerdown', startMsgHold);
  chatMessagesEl.addEventListener('pointermove', onMsgMove);
  chatMessagesEl.addEventListener('pointerup', cancelMsgHold);
  chatMessagesEl.addEventListener('pointerleave', cancelMsgHold);
  chatMessagesEl.addEventListener('pointercancel', cancelMsgHold);
  chatMessagesEl.addEventListener('scroll', cancelMsgHold, { passive: true });

  // ---- 既読バッジ（2026-08-10）----
  // messages/{key}/readBy/{名前} = true を立てるだけ。自分の送信分は対象外（読む必要がないので）。
  // すでに立っているものは書き直さない（無駄な書き込みを避ける）。
  function markMessagesRead() {
    if (!db) return;
    const myName = getUserName();
    if (!myName) return;
    chatMessages.forEach(m => {
      if (m.name === myName) return;
      if (m.readBy && m.readBy[myName]) return;
      try { db.ref('messages/' + m.key + '/readBy/' + myName).set(true); } catch (e) {}
    });
  }

  // 直近100件だけ購読（現場のやりとりが読めれば十分・古いものは追わない）
  if (db) {
    try {
      db.ref('messages').limitToLast(100).on('value', (snap) => {
        const val = snap.val() || {};
        chatMessages = Object.keys(val).sort().map(key => Object.assign({ key }, val[key]));
        // パネルを開いている間に届いた分（自分が今送った分も含む）はその場で既読扱いにする
        // ＝そうしないと「今開いて送ったメッセージ」が、閉じた瞬間バナーの新着として出てしまう
        if (chatOpen && chatMessages.length) {
          setChatLastRead(chatMessages[chatMessages.length - 1].key);
          markMessagesRead();
        }
        renderChatBanner();
        if (chatOpen) renderChatMessages();
      });
    } catch (e) {}
  }

  // ---- V18.1：定型文を Firebase から動的に読み込む（正人さんの編集アプリで増減できるように）----
  // 表示順は order 昇順。プレースホルダー（先頭の「定型文を選ぶ▼」）は常に残す。
  function renderPresetOptions(list) {
    const current = chatPresetSelect.value;
    const placeholder = '<option value="" selected>定型文を選ぶ</option>';
    const opts = list
      .slice()
      .sort((a, b) => (a.order || 0) - (b.order || 0))
      .map(t => `<option value="${escapeHtml(t.text)}">${escapeHtml(t.text)}</option>`)
      .join('');
    chatPresetSelect.innerHTML = placeholder + opts;
    // 選択中に更新が飛んできても、選択状態はできるだけ保つ（無ければプレースホルダーへ）
    chatPresetSelect.value = current && [...chatPresetSelect.options].some(o => o.value === current) ? current : '';
  }
  if (db) {
    try {
      db.ref('templates').on('value', (snap) => {
        const val = snap.val() || {};
        const list = Object.keys(val).map(key => Object.assign({ key }, val[key]));
        renderPresetOptions(list);
      });
    } catch (e) {}
  }

  function updateChatElapsed() {
    if (!chatElapsedEl) return;
    chatElapsedEl.classList.toggle('running', running);
    // 通知ボタン追加で横幅が減り、1行だと「計測中」の途中など変な位置で折り返ってしまうため、
    // 区間名／計測中◯分の2行に固定して中央寄せする（2026-08-12・正人さん提案）
    chatElapsedEl.innerHTML = running
      ? escapeHtml(currentSection) + '<br>計測中 ' + escapeHtml(display.textContent)
      : '';
  }

  function openChat() {
    chatOpen = true;
    chatOverlay.hidden = false;
    renderChatMessages();
    // V18初版は「開いたら既読」のシンプルな判定（正人さんと合意ずみ）
    if (chatMessages.length) setChatLastRead(chatMessages[chatMessages.length - 1].key);
    markMessagesRead();
    renderChatBanner();
    updateChatElapsed();
    // Androidの戻るボタンでも閉じられるように履歴を1つ積む
    try { history.pushState({ nespaPTChat: true }, ''); } catch (e) {}
  }
  function closeChat(fromPopstate) {
    chatOpen = false;
    chatOverlay.hidden = true;
    if (!fromPopstate) {
      try { history.back(); } catch (e) {}
    }
  }
  window.addEventListener('popstate', () => {
    if (chatOpen) closeChat(true);
  });

  chatBanner.addEventListener('click', openChat);
  chatBanner.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openChat(); }
  });
  chatBackBtn.addEventListener('click', () => closeChat(false));

  // V19.10：チャットも区間計測のログ・状況と同じ未送信キュー(outbox)経由に変更。
  // push()でキーだけ先に確保 → 控えをlocalStorageに残す → 送信を試みる。
  // アプリが裏で落とされても控えが残るので、区間計測と同じくメッセージが跡形もなく消える事故を防げる。
  function sendChatMessage(text, to) {
    const t = (text || '').trim();
    if (!t) return;
    if (!db) { alert('オフラインのため送信できません。ネットにつながってから再度お試しください。'); return; }
    const ref = db.ref('messages').push();
    const payload = { text: t, name: getUserName() || 'ゲスト', time: Date.now() };
    if (to) payload.to = to;
    const entry = { id: 'chat:' + ref.key, kind: 'chat', path: 'messages/' + ref.key, data: payload, at: Date.now(), chatKey: ref.key };
    outboxPut(entry);
    flushOutbox();
    if (chatOpen) renderChatMessages();
  }

  // V20.1：区間（任意）を選んでいたら、メッセージの頭に【区間名】を付けて送る。
  // 選んでいなければ今までどおり（正人さんの依頼・2026-08-25）。
  function chatSectionPrefix() {
    const sec = chatSectionSelect.value;
    return sec ? '【' + sec + '】' : '';
  }

  // 定型文プルダウン＝選んだ瞬間に即送信（2タップ完結）。
  // 同じ項目を連続で選んでも change が発火するよう、送信のたびに初期表示へ戻す。
  chatPresetSelect.addEventListener('change', () => {
    const text = chatPresetSelect.value;
    if (!text) return;
    const to = chatToSelect.value || '';
    sendChatMessage(chatSectionPrefix() + text, to);
    chatPresetSelect.value = '';
    chatToSelect.value = '';   // 宛先も毎回「全員」に戻す（正人さんの依頼・2026-08-10）
    chatSectionSelect.value = ''; // 区間も毎回リセット（宛先と同じ考え方・V20.1）
  });

  // ★区間だけ選んで本文が空のときは、タグだけのメッセージにならないよう prefix を付けない
  function composeChatFreeText() {
    const raw = chatFreeInput.value;
    return raw.trim() ? chatSectionPrefix() + raw : raw;
  }
  chatSendBtn.addEventListener('click', () => {
    const to = chatToSelect.value || '';
    sendChatMessage(composeChatFreeText(), to);
    chatFreeInput.value = '';
    chatToSelect.value = '';
    chatSectionSelect.value = '';
  });
  chatFreeInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const to = chatToSelect.value || '';
      sendChatMessage(composeChatFreeText(), to);
      chatFreeInput.value = '';
      chatToSelect.value = '';
      chatSectionSelect.value = '';
    }
  });

  // ---- V19：新着チャットのプッシュ通知 ----
  // fcmTokens/{名前}/{token} = true の形でFirebaseに登録しておくと、Cloud Functions側が
  // 新着メッセージ時に送信者以外へ配信してくれる（アプリを閉じていても・画面オフでも届く）。
  // ボタンの緑／グレーは「実際にトークンを保存できているか」で判定する（ブラウザの許可状態だけでは
  // 見た目と実態がズレる。2026-08-12・fcmTokensの書き込みがルール未設定で弾かれていた件で判明）。
  const FCM_TOKEN_KEY = 'nespaPT_fcmToken';
  const FCM_OPTOUT_KEY = 'nespaPT_fcmOptOut';
  function getStoredToken() { try { return localStorage.getItem(FCM_TOKEN_KEY) || null; } catch (e) { return null; } }
  function setStoredToken(t) { try { t ? localStorage.setItem(FCM_TOKEN_KEY, t) : localStorage.removeItem(FCM_TOKEN_KEY); } catch (e) {} }
  function isOptedOut() { try { return localStorage.getItem(FCM_OPTOUT_KEY) === '1'; } catch (e) { return false; } }
  function setOptedOut(v) { try { v ? localStorage.setItem(FCM_OPTOUT_KEY, '1') : localStorage.removeItem(FCM_OPTOUT_KEY); } catch (e) {} }

  function updateNotifBtn() {
    if (!notifBtn) return;
    if (!('Notification' in window) || !messaging) {
      notifBtn.classList.add('unsupported');
      return;
    }
    if (getStoredToken() && Notification.permission === 'granted') {
      notifBtn.textContent = '🔔 通知オン';
      notifBtn.classList.add('on');
    } else {
      notifBtn.textContent = '🔔 通知オフ';
      notifBtn.classList.remove('on');
    }
  }

  // 取得したトークンを、今入力されている名前に紐づけて保存する（名前が空ならスキップ＝あとで名前欄変更時に再同期）
  // 名前ごとに常に「今の1トークンだけ」を持つように、ノードごと置き換える（追加ではなく上書き）。
  // 追加式だと、通知の許可し直しやService Worker更新のたびに古いトークンが残り続け、
  // 同じ端末に何重にも通知が届いてしまう（2026-08-12・実機テストで発覚）。
  const FCM_NAME_KEY = 'nespaPT_fcmName'; // この端末が最後にどの名前でトークンを登録したか
  function getStoredFcmName() { try { return localStorage.getItem(FCM_NAME_KEY) || null; } catch (e) { return null; } }
  function setStoredFcmName(n) { try { n ? localStorage.setItem(FCM_NAME_KEY, n) : localStorage.removeItem(FCM_NAME_KEY); } catch (e) {} }

  function syncFcmToken(token) {
    if (!db || !token) return;
    const myName = getUserName();
    if (!myName) return;
    const oldName = getStoredFcmName();
    // 名前欄を切り替えた場合、古い名前側に残った同じトークンを消す
    // （消さないと同じ端末が2つの名前に二重登録され、他の人からのメッセージが2回届いてしまう。
    //  2026-08-12・大野さん/服部さんのメッセージが正人さんの端末に2回届く事象で発覚）
    if (oldName && oldName !== myName) {
      try { db.ref('fcmTokens/' + fbKey(oldName) + '/' + token).remove(); } catch (e) {}
    }
    try { db.ref('fcmTokens/' + fbKey(myName)).set({ [token]: true }); } catch (e) {}
    setStoredFcmName(myName);
  }

  let currentFcmToken = null;
  function refreshFcmToken() {
    if (!messaging || !swRegistration) return;
    if (!VAPID_KEY || VAPID_KEY.indexOf('PLACEHOLDER') === 0) return; // 鍵未設定のうちは何もしない
    messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: swRegistration })
      .then((token) => {
        if (!token) return;
        currentFcmToken = token;
        setStoredToken(token);
        syncFcmToken(token);
        updateNotifBtn();
      })
      .catch((e) => { console.warn('FCMトークン取得に失敗', e); });
  }

  // アプリを開くたびに、ボタンの表示（ローカルの記録）とFirebase側の実データを突き合わせる。
  // ズレていたら（手動削除・無効化された等）自動で取り直して登録し直す（2026-08-12・
  // 「表示がオンでも実際には届かない」ズレが起こり得ると気づいたための対策）。
  function verifyAndSyncFcmToken() {
    const myName = getUserName();
    const storedToken = getStoredToken();
    if (!db || !myName || !storedToken) { refreshFcmToken(); return; }
    db.ref('fcmTokens/' + fbKey(myName) + '/' + storedToken).once('value')
      .then((snap) => {
        if (snap.val() === true) {
          // Firebase側にも同じトークンが生きている＝表示と実態が一致
          currentFcmToken = storedToken;
          updateNotifBtn();
        } else {
          console.log('通知トークンがFirebase側と一致しないため再登録します');
          refreshFcmToken();
        }
      })
      .catch((e) => {
        console.warn('通知トークンの確認に失敗、念のため取り直します', e);
        refreshFcmToken();
      });
  }

  // 通知オフに切り替える：Firebase側の自分のトークンを消して、以後の自動再登録も止める
  function disableNotifications() {
    const token = getStoredToken();
    const myName = getUserName();
    if (db && token && myName) {
      try { db.ref('fcmTokens/' + fbKey(myName) + '/' + token).remove(); } catch (e) {}
    }
    currentFcmToken = null;
    setStoredToken(null);
    setOptedOut(true);
    updateNotifBtn();
  }

  if (notifBtn) {
    notifBtn.addEventListener('click', async () => {
      if (!('Notification' in window) || !messaging) {
        alert('この端末・ブラウザは通知に対応していません');
        return;
      }
      // 既にオン（トークン登録済み）なら、押すたびにオフへトグル
      if (getStoredToken() && Notification.permission === 'granted') {
        disableNotifications();
        return;
      }
      try {
        const permission = await Notification.requestPermission();
        updateNotifBtn();
        if (permission !== 'granted') {
          alert('通知が許可されませんでした。あとで端末の通知設定から許可することもできます。');
          return;
        }
        setOptedOut(false);
        if (!swRegistration) swRegistration = await navigator.serviceWorker.ready;
        refreshFcmToken();
      } catch (e) {
        alert('通知の設定に失敗しました: ' + e.message);
      }
    });
  }

  // 名前を選び直した／変えたときも、既に通知オンならそのトークンを新しい名前に登録し直す
  userNameEl.addEventListener('change', () => {
    if (currentFcmToken) syncFcmToken(currentFcmToken);
  });

  updateNotifBtn();

  // 計測中に閉じた／リロードした場合、開き直したときに計測を復元して継続する（V12）
  function restoreActive() {
    let raw = null;
    try { raw = localStorage.getItem(ACTIVE_KEY); } catch (e) {}
    if (!raw) return;
    let s = null;
    try { s = JSON.parse(raw); } catch (e) { s = null; }
    if (!s || !s.section || !s.startTime) { clearActive(); return; }

    running = true;
    startTime = s.startTime;
    currentSection = s.section;
    if (s.name) userNameEl.value = s.name;
    sectionSelect.value = s.section;
    updateSectionIcon();

    sectionSelect.disabled = true;
    userNameEl.disabled = true;
    updateReloadButton();
    clearBtn.disabled = true;
    status.textContent = '計測中';
    status.classList.remove('idle');
    cart.classList.add('active');
    document.body.classList.add('running');

    // 共有側にも「計測中」を再登録（開始時刻はそのまま維持）
    writeStatus(currentSection, 'active', startTime);
    tick();
  }

  loadRecords();
  // ★未送信の控えは、計測状態の復元より先に読み込む（復元でstatusを書くときキューを正しく引き継ぐため）
  loadOutbox();
  updateOutboxUi();
  updateTable();
  updateSectionIcon(); // 起動時点の選択中区間（プルダウンの先頭など）のアイコンを表示（V20.0）
  restoreActive();
  // restoreActive()が「復元する状態が無い」で早期returnした場合もボタン表示を正しく初期化する
  // （runningがtrueなら既にupdateReloadButton()済みだが、再度呼んでも副作用は無いので毎回呼ぶ）
  updateReloadButton();

  // ---- V19.12：長押しリロードが本当に効いたかを一瞬だけ知らせる ----
  // PWAはservice workerのキャッシュから一瞬で再読み込みされ、状態もJSがそっくり同じに
  // 復元するため、リロードされたのかどうかが見た目では分からない（2026-08-20・正人さんの指摘）。
  // ボタン側でsessionStorageに目印を置いてからreload()しているので、起動直後にそれを見つけたら
  // ちょうど今しがた押していたボタン（＝リロード役だった方）の文字を「✅更新しました」に
  // 一瞬置き換えてから、元の表示に戻す。画面上部のトーストは気づきにくいとの指摘で、
  // 押した指の下＝ボタン自身で知らせる形に変更（2026-08-20）。
  try {
    if (sessionStorage.getItem(RELOAD_TOAST_KEY)) {
      sessionStorage.removeItem(RELOAD_TOAST_KEY);
      // リロード直前はrunningの値で「どっちがリロードボタンだったか」が決まる。
      // その値は再読み込み後も同じ状態（restoreActiveで復元／もしくは元々idle）なので、
      // 今のrunningを見れば「さっき押したのはこっち」が分かる。
      const doneBtn = running ? startBtn : stopBtn;
      doneBtn.classList.add('btn-reload-done');
      doneBtn.innerHTML = '<span class="reload-label">✅更新しました</span>';
      setTimeout(() => {
        doneBtn.classList.remove('btn-reload-done');
        updateReloadButton();
      }, 1500);
    }
  } catch (e) {}

  // ---- V20.2：チャットの未送信メッセージを長押しリロードしたときは、起動後もチャット画面に戻す ----
  // （正人さんの実機報告・2026-08-25＝そのまま計測画面に戻ってしまうと「チャットを見ていたのに」となる）。
  try {
    if (sessionStorage.getItem(CHAT_REOPEN_KEY)) {
      sessionStorage.removeItem(CHAT_REOPEN_KEY);
      openChat();
    }
  } catch (e) {}

  // ---- V19.7：isConnectedの更新＋再送のきっかけ（どれか1つでも拾えれば記録は復活する）----
  // Firebaseが「つながった/切れた」と判断した瞬間。これが一番あてになる基準（true/falseどちらも拾う）
  if (db) {
    try {
      db.ref('.info/connected').on('value', (s) => {
        isConnected = !!s.val();
        if (isConnected) flushOutbox();
      });
    } catch (e) {}
  }
  // 端末側のオンライン/オフライン切り替え（Firebaseの判定が来る前の保険として即座に反映）
  window.addEventListener('online', () => { isConnected = true; flushOutbox(); });
  window.addEventListener('offline', () => { isConnected = false; });

  // ---- V19.12：isConnectedが「取りこぼしたまま固まる」問題への自己修復 ----
  // きっかけ＝2026-08-18、回線は正常なのに未送信バッジが開始直後からしばらく消えず、
  // リロードすると即消えるという報告。原因の直接確認（debugLog）はルール未設定で
  // 記録が取れていなかったため今回ルールを直したが、コード上は「isConnectedを更新する
  // きっかけ（online/offlineイベント・.info/connectedの通知）を一度も拾えなかった場合、
  // 30秒ごとの保険もisConnectedを見て止まってしまい、フラグがfalseに固まったまま
  // 誰も気づけない」という弱点があった。リロードで直るのは、起動時に
  // isConnected=navigator.onLineへ作り直されるため。
  // → 受け身で通知を待つだけでなく、navigator.onLineを直接見て食い違っていたら
  //   その場で補正する「能動的な再チェック」を追加する。
  function recheckConnection() {
    // ブラウザが「オンライン」だと言っているのにisConnectedがfalseのまま＝取りこぼし濃厚。
    // その場で補正して再送を試みる（実際にオフラインならこの後の送信自体が失敗し、
    // .info/connectedやofflineイベントが追って正しい状態に直してくれる）。
    if (navigator.onLine && !isConnected) isConnected = true;
    if (db) {
      try {
        db.ref('.info/connected').once('value').then((s) => {
          isConnected = !!s.val();
          flushOutbox();
        }).catch(() => { flushOutbox(); });
        return;
      } catch (e) {}
    }
    flushOutbox();
  }
  // アプリが裏から表に戻ってきたとき（スマホはここが実質の再開点になる）
  document.addEventListener('visibilitychange', () => { if (!document.hidden) recheckConnection(); });
  // 上のどれも拾えなかった場合の保険。渡す関数もrecheckConnectionにして、
  // 「isConnectedを信じてflushOutboxを呼ぶだけ」から「isConnected自体を都度疑って直す」に変更
  // 呼ぶ内容が軽い（未送信が無ければ即終了・.info/connectedの読み取りも軽量）ため、
  // 固まってから気づくまでの最大待ち時間を縮めるべく30秒→15秒に短縮（2026-08-20・正人さんの依頼）
  setInterval(recheckConnection, 15000);

  // V19.12：タップでの手動再送は廃止（正人さんの依頼・2026-08-20）。
  // 未送信件数の表示はリロードボタンに統合し、再送はrecheckConnection()の自動リトライに一本化した。

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then((reg) => {
        swRegistration = reg;
        // この端末で既に通知が許可済みなら、ページを開くたびにFirebase側の実データと突き合わせて確認・修復する
        if ('Notification' in window && Notification.permission === 'granted' && !isOptedOut()) verifyAndSyncFcmToken();
      }).catch(() => {});
    });
  }
</script>
</body>
</html>
