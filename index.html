<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>売場ピッキング区間計測</title>
<meta name="theme-color" content="#101418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="区間計測">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", Meiryo, sans-serif;
    background: #101418;
    color: #eaeef2;
    display: flex;
    justify-content: center;
    padding: 24px 12px 60px;
    transition: background 0.3s ease;
  }
  body.running {
    background: #ffffff;
  }
  body.running .display {
    color: #000000;
  }
  .app { width: 100%; max-width: 480px; }
  h1 {
    font-size: 18px;
    font-weight: 600;
    text-align: center;
    margin: 0 0 20px;
    color: #9fb2c7;
  }
  h1 .ver {
    font-size: 11px;
    font-weight: 400;
    color: #5c6773;
    margin-left: 6px;
  }
  label {
    display: block;
    font-size: 12px;
    color: #7a8794;
    margin-bottom: 6px;
  }
  /* ラベル内の補足（例：（チップで選択可））は少し小さく（V16） */
  label small {
    font-size: 11px;
    opacity: 0.85;
  }
  select, input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    color: #eaeef2;
    background: #1d232b;
    border: 1px solid #2a323b;
    border-radius: 10px;
    margin-bottom: 20px;
    appearance: none;
    -webkit-appearance: none;
  }
  /* 計測中も「どの区間か」を読めるように薄くしすぎない（V16） */
  select:disabled { opacity: 0.75; }
  /* 区間の選択欄は、選択中チップと同じ白枠で「対」にする（V16） */
  #sectionSelect { box-shadow: 0 0 0 2px #ffffff; }
  /* タップ時に出るブラウザ標準のフォーカス枠を消す（白枠＝選択中、と紛らわしいため・V16） */
  select:focus { outline: none; }
  /* 名前と区間を半分ずつ横並びに（V16） */
  .field-row {
    display: flex;
    align-items: flex-end;  /* ラベルが2行になっても入力欄の高さを揃える */
    gap: 10px;
  }
  .field {
    min-width: 0;
  }
  /* 名前:区間 = 4:6（名前側が窮屈だったため3:7から戻した） */
  .field:nth-child(1) { flex: 4 1 0; }
  .field:nth-child(2) { flex: 6 1 0; }
  .display-row {
    display: flex;
    align-items: center;
    margin-bottom: 20px;
    min-height: 56px;
  }
  .cart-lane {
    flex: 1;
    position: relative;
    align-self: stretch;
  }
  .display {
    font-size: 48px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    letter-spacing: 1px;
    color: #ffffff;
    line-height: 1;
  }
  .cart {
    position: absolute;
    top: 50%;
    left: 0;
    font-size: 30px;
    line-height: 1;
    visibility: hidden;
  }
  /* 行き1.4秒（空なので速い）＋右端で1.0秒停止（3個積み込む）＋帰り2.4秒（積んでいるのでゆっくり）
     ＝1サイクル4.8秒。行きと帰りで約1.7倍の速度差。「計測中」の明滅も同じ4.8秒で同期（V16.1） */
  .cart.active {
    visibility: visible;
    animation: roll 4.8s ease-in-out infinite;
  }
  @keyframes roll {
    0%       { left: 0;                 transform: translateY(-50%) scaleX(-1); }
    29.167%  { left: calc(100% - 34px); transform: translateY(-50%) scaleX(-1); } /* 1.4秒＝右端に到着 */
    29.18%   { left: calc(100% - 34px); transform: translateY(-50%) scaleX(1); }  /* 着いたら向きを変える */
    50%      { left: calc(100% - 34px); transform: translateY(-50%) scaleX(1); }  /* 1.0秒停止＝積み込み */
    100%     { left: 0;                 transform: translateY(-50%) scaleX(1); }  /* 2.4秒かけてゆっくり戻る */
  }
  /* カートに積む商品（V16.1・小松原さんの提案）
     行きは空、右端で商品を2個積んで帰ってくる（1往復＝3.6秒でカートの往復と同じサイクル）。
     ※商品が見えるのは必ず帰り道＝カートが反転していない区間なので、商品側で向きを
       打ち消す必要はない（行きは opacity:0 で隠れている） */
  .cart .load {
    position: absolute;
    top: 4px;
    font-size: 12px;
    line-height: 1;
    opacity: 0;
    pointer-events: none;
  }
  /* カゴからはみ出さないよう左寄せ（V16.1調整）。3個目は2個の上に載せて三角に積む */
  .cart .load1 { left: 4px; }
  .cart .load2 { left: 13px; }
  .cart .load3 { left: 8px; top: -3px; }
  /* カート本体を商品より前面に置くと「カゴの中に入っている」ように見える（V16.1） */
  .cart .glyph { position: relative; z-index: 2; }
  .cart .load  { z-index: 1; }
  .cart.active .load1 { animation: load1 4.8s linear infinite; }
  .cart.active .load2 { animation: load2 4.8s linear infinite; }
  .cart.active .load3 { animation: load3 4.8s linear infinite; }
  /* 1個目：カートが右端で止まった直後（1.45秒）に、18px上から0.55秒かけて落ちてくる */
  @keyframes load1 {
    0%,     30.0%  { opacity: 0; transform: translateY(-18px); }
    30.208%        { opacity: 1; transform: translateY(-18px); animation-timing-function: ease-in; }
    41.667%, 96.7% { opacity: 1; transform: translateY(0); }
    100%           { opacity: 0; transform: translateY(0); }
  }
  /* 2個目：1個目より 0.14秒おくれ（ズラすのがミソ） */
  @keyframes load2 {
    0%,     32.9%  { opacity: 0; transform: translateY(-18px); }
    33.125%        { opacity: 1; transform: translateY(-18px); animation-timing-function: ease-in; }
    44.583%, 96.7% { opacity: 1; transform: translateY(0); }
    100%           { opacity: 0; transform: translateY(0); }
  }
  /* 3個目：さらに0.14秒おくれて、下の2個の上（三角の頂点）に着地 */
  @keyframes load3 {
    0%,     35.8%  { opacity: 0; transform: translateY(-18px); }
    36.042%        { opacity: 1; transform: translateY(-18px); animation-timing-function: ease-in; }
    47.5%,  96.7%  { opacity: 1; transform: translateY(0); }
    100%           { opacity: 0; transform: translateY(0); }
  }
  /* 状態表示は計測時間の左横・上下センター（V16） */
  .status {
    flex: 1 1 0;
    min-width: 0;
    font-size: 20px;
    line-height: 1.35;
    text-align: center;
    color: #6fcf97;
  }
  .status.idle { color: #7a8794; }
  /* 計測中＝スタートボタンと同じ緑で、ゆっくり明滅させて「動いている」ことを伝える（V16） */
  body.running .status {
    color: #2f9e6a;
    animation: blink 4.8s ease-in-out infinite;
  }
  /* カートに完全同期（V16.1）。1往復＝呼吸ひとつ。
     左端でパッと点灯 → 空で行く1.4秒＋積み込みの1.0秒は点灯キープ（＝前半2.4秒） →
     荷物を積んで帰る2.4秒でゆっくり暗転 → 左端で荷降ろしと同時にまたパッと点灯 */
  @keyframes blink {
    0%,  50%  { opacity: 1; }
    94%, 100% { opacity: 0.15; }
  }
  .buttons {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }
  button {
    flex: 1;
    padding: 14px 0;
    font-size: 16px;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.35; cursor: default; }
  .btn-start { background: #2f9e6a; color: white; }
  .btn-stop { background: #d9534f; color: white; }
  .records {
    margin-top: 16px;
    background: #171c22;
    border-radius: 12px;
    overflow: hidden;
  }
  /* 記録クリアは記録一覧カードの下へ・長押しで発動（V16） */
  .clear-zone {
    padding: 14px 16px;
    display: flex;
    justify-content: center;
    border-top: 1px solid #232a33;
  }
  .btn-clear-all {
    position: relative;
    overflow: hidden;
    flex: none;
    width: auto;
    min-width: 220px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid #3a2a2a;
    border-radius: 10px;
    background: #1a1512;
    color: #b98a8a;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
  }
  .btn-clear-all .clear-label {
    position: relative;
    z-index: 1;
  }
  .btn-clear-all.holding .clear-label { color: #ffffff; }
  .clear-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: #d9534f;
    z-index: 0;
  }
  .btn-clear-all.holding .clear-fill {
    width: 100%;
    transition: width 1.4s linear;
  }
  .records-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: #1d232b;
    font-size: 15px;
    color: #8fa0b3;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 18px;
  }
  th, td {
    padding: 11px 8px;
    text-align: left;
    white-space: nowrap;
    border-bottom: 1px solid #232a33;
  }
  th { color: #7a8794; font-weight: 500; font-size: 14px; }
  td.num { color: #7a8794; width: 20px; font-size: 14px; }
  td.dur { font-variant-numeric: tabular-nums; color: #ffd479; text-align: right; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .empty {
    text-align: center;
    padding: 24px;
    color: #5c6773;
    font-size: 15px;
  }
  .total {
    padding: 12px 16px;
    text-align: right;
    font-size: 15px;
    color: #9fb2c7;
    border-top: 1px solid #232a33;
  }
  .total b { color: #ffd479; font-variant-numeric: tabular-nums; font-size: 15px; }
  .section-status {
    background: #171c22;
    border-radius: 12px;
    padding: 14px 16px;
  }
  .section-status-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: #8fa0b3;
    margin-bottom: 12px;
  }
  .section-hint {
    font-size: 13px;
    color: #5c6773;
    line-height: 1.5;
    margin-top: 14px;
    text-align: center;
  }
  .reset-zone {
    margin-top: 14px;
    display: flex;
    justify-content: center;
  }
  .btn-reset-all {
    position: relative;
    overflow: hidden;
    flex: none;
    width: auto;
    min-width: 220px;
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid #3a2a2a;
    border-radius: 10px;
    background: #1a1512;
    color: #b98a8a;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
  }
  .btn-reset-all .reset-label {
    position: relative;
    z-index: 1;
  }
  .btn-reset-all.holding .reset-label { color: #ffffff; }
  .reset-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: #d9534f;
    z-index: 0;
  }
  .btn-reset-all.holding .reset-fill {
    width: 100%;
    transition: width 1.4s linear;
  }
  .chips {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .chip {
    position: relative;
    overflow: hidden;
    font-size: clamp(13px, 4.4vw, 18px);
    padding: 8px 6px;
    text-align: center;
    white-space: nowrap;
    border-radius: 999px;
    background: #232a33;
    color: #c5d0dc;
    border: 1px solid #2a323b;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: pan-y;
  }
  .chip-label { position: relative; z-index: 1; }
  .chip-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    width: 0;
    background: rgba(255,255,255,0.32);
    z-index: 0;
  }
  .chip.holding .chip-fill {
    width: 100%;
    transition: width 1.4s linear;
  }
  .chip.done, .chip.skip {
    background: #d9534f;
    color: #ffffff;
    border-color: #d9534f;
    font-weight: 600;
  }
  .chip.active {
    background: #2f9e6a;
    color: #ffffff;
    border-color: #2f9e6a;
    font-weight: 600;
  }
  /* いま選ばれている区間（タップで選択・V16）＝「区間を選ぶ」欄と同じ白枠で対にする */
  .chip.selected {
    box-shadow: 0 0 0 2px #ffffff;
  }
  .chip small {
    display: block;
    font-size: clamp(10px, 2.7vw, 12px);
    font-weight: 400;
    opacity: 0.9;
    margin-top: 2px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>売場ピッキング区間計測<span class="ver">Ver.16.1</span></h1>
  <div class="field-row">
  <div class="field">
  <label for="userName">あなたの名前</label>
  <select id="userName">
    <option value="平野">平野</option>
    <option value="高橋">高橋</option>
    <option value="小松原">小松原</option>
    <option value="奥永">奥永</option>
    <option value="大野">大野</option>
    <option value="服部">服部</option>
    <option value="ゲスト">ゲスト</option>
  </select>
  </div>
  <div class="field">
  <label for="sectionSelect">区間を選ぶ<small>（↓チップでも可）</small></label>
  <select id="sectionSelect">
    <option value="農産">農産</option>
    <option value="水産・畜産">水産・畜産</option>
    <option value="デリカ">デリカ</option>
    <option value="グロサリ①">グロサリ①</option>
    <option value="グロサリ②">グロサリ②</option>
    <option value="グロサリ③">グロサリ③</option>
    <option value="デイリー①">デイリー①</option>
    <option value="デイリー②">デイリー②</option>
    <option value="デイリー③">デイリー③</option>
    <option value="デリコン">デリコン</option>
    <option value="リカー">リカー</option>
    <option value="ケース">ケース</option>
    <option value="その他">その他</option>
    <option value="衣料・住余">衣料・住余</option>
    <option value="フリー">フリー</option>
  </select>
  </div>
  </div>
  <div class="display-row">
    <span class="status idle" id="status">停止中</span>
    <span class="display" id="display">0分</span>
    <span class="cart-lane">
      <span class="cart" id="cart"><span class="load load1" id="cartLoad1">🍎</span><span class="load load2" id="cartLoad2">🥬</span><span class="load load3" id="cartLoad3">🐟</span><span class="glyph">🛒</span></span>
    </span>
  </div>
  <div class="buttons">
    <button class="btn-start" id="startBtn">スタート</button>
    <button class="btn-stop" id="stopBtn" disabled>ストップ</button>
  </div>
  <div class="section-status">
    <div class="section-status-header">
      <span>区間の状況（緑＝計測中　赤＝完了・注文なし）</span>
    </div>
    <div class="chips" id="sectionList"></div>
    <div class="section-hint">区間を長押し→「注文なし」に<br>赤を長押し→取消（完了は記録も削除）</div>
    <div class="reset-zone">
      <button class="btn-reset-all" id="resetAllBtn" type="button">
        <span class="reset-fill" id="resetFill"></span>
        <span class="reset-label">⟳ 全員リセット（長押し）</span>
      </button>
    </div>
  </div>
  <div class="records">
    <div class="records-header">
      <span>記録一覧</span>
      <span id="count">0件</span>
    </div>
    <div id="tableWrap">
      <div class="empty" id="emptyMsg">まだ記録がありません</div>
    </div>
    <div class="total" id="totalRow" style="display:none;">
      合計時間: <b id="totalTime">0分</b>
    </div>
    <div class="clear-zone">
      <button class="btn-clear-all" id="clearBtn" type="button">
        <span class="clear-fill" id="clearFill"></span>
        <span class="clear-label">🗑 記録をクリア（長押し）</span>
      </button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  let running = false;
  let startTime = null;
  let currentSection = '';
  let rafId = null;
  let records = [];
  let sharedStatus = {};
  let db = null;
  let chipHolding = false;
  let pendingRender = false;

  const sectionSelect = document.getElementById('sectionSelect');
  const display = document.getElementById('display');
  const cart = document.getElementById('cart');
  const status = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const clearBtn = document.getElementById('clearBtn');
  const tableWrap = document.getElementById('tableWrap');
  const emptyMsg = document.getElementById('emptyMsg');
  const countEl = document.getElementById('count');
  const totalRow = document.getElementById('totalRow');
  const totalTimeEl = document.getElementById('totalTime');
  const sectionListEl = document.getElementById('sectionList');
  const userNameEl = document.getElementById('userName');
  const resetAllBtn = document.getElementById('resetAllBtn');

  // ---- カートに積む商品（V16.1）----
  // 1往復（4.8秒）につき必ず3個（下2個＋上1個の三角積み）。組み合わせは1往復ごとに次の3つへ。
  // 切り替わるのは左端＝どれも見えていない瞬間なので、入れ替わるところは見えない。
  // 並びは売場の順（農産→水産→畜産→デリカ→グロサリ→デイリー→リカー）
  const cartLoads = [
    document.getElementById('cartLoad1'),
    document.getElementById('cartLoad2'),
    document.getElementById('cartLoad3')
  ];
  const LOAD_ITEMS = ['🍎', '🥬', '🐟', '🥩', '🍱', '🍞', '🧃', '🥛', '🥚', '🍺'];
  let loadIndex = 0;
  if (cartLoads.every(Boolean)) {
    const applyLoadItems = () => {
      cartLoads.forEach((el, i) => {
        el.textContent = LOAD_ITEMS[(loadIndex + i) % LOAD_ITEMS.length];
      });
    };
    applyLoadItems();
    // load1（4.8秒サイクル）が1周するたび＝左端で荷物が空になった瞬間に次の3つへ
    cartLoads[0].addEventListener('animationiteration', () => {
      loadIndex = (loadIndex + 3) % LOAD_ITEMS.length;
      applyLoadItems();
    });
  }

  // ---- Firebase（みんなで共有）----
  const firebaseConfig = {
    apiKey: "AIzaSyCzrEc7e9qGPH_2PogrZfFSH8H5Z035aV0",
    authDomain: "nespa-pt.firebaseapp.com",
    databaseURL: "https://nespa-pt-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "nespa-pt",
    storageBucket: "nespa-pt.firebasestorage.app",
    messagingSenderId: "247771639596",
    appId: "1:247771639596:web:3b980f4ce44613ed6b0689"
  };
  try {
    if (typeof firebase !== 'undefined') {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      db.ref('status').on('value', (snap) => {
        sharedStatus = snap.val() || {};
        renderSections();
      });
    }
  } catch (e) { db = null; }

  function fbKey(s) { return String(s).replace(/[.#$\/\[\]]/g, '_'); }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function getUserName() { return (userNameEl.value || '').trim(); }

  const savedName = localStorage.getItem('nespaPT_name') || '';
  if (savedName) userNameEl.value = savedName;
  userNameEl.addEventListener('change', () => {
    localStorage.setItem('nespaPT_name', userNameEl.value);
  });

  // ---- 全員リセットは「長押し」で発動（誤タップ防止・V13）----
  const RESET_HOLD_MS = 1400;
  let resetHoldTimer = null;
  let resetHoldStartX = 0;
  let resetHoldStartY = 0;

  function doResetAll() {
    if (db) { try { db.ref('status').remove(); } catch (e) {} }
    else { alert('オフラインのため共有リセットできません。ネットにつながってから再度お試しください。'); }
  }
  function startResetHold(e) {
    // スワイプを妨げないため preventDefault はしない（V16）
    if (resetHoldTimer) return;
    resetHoldStartX = e ? e.clientX : 0;
    resetHoldStartY = e ? e.clientY : 0;
    resetAllBtn.classList.add('holding');
    resetHoldTimer = setTimeout(() => {
      resetHoldTimer = null;
      resetAllBtn.classList.remove('holding');
      if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
      doResetAll();
    }, RESET_HOLD_MS);
  }
  function cancelResetHold() {
    if (resetHoldTimer) { clearTimeout(resetHoldTimer); resetHoldTimer = null; }
    resetAllBtn.classList.remove('holding');
  }
  // 指が動いたらスワイプ（スクロール）とみなして長押しを中止（V16）
  function onResetMove(e) {
    if (!resetHoldTimer) return;
    if (Math.abs(e.clientX - resetHoldStartX) > 8 || Math.abs(e.clientY - resetHoldStartY) > 8) {
      cancelResetHold();
    }
  }
  resetAllBtn.addEventListener('pointerdown', startResetHold);
  resetAllBtn.addEventListener('pointermove', onResetMove);
  resetAllBtn.addEventListener('pointerup', cancelResetHold);
  resetAllBtn.addEventListener('pointerleave', cancelResetHold);
  resetAllBtn.addEventListener('pointercancel', cancelResetHold);
  window.addEventListener('scroll', cancelResetHold, { passive: true });
  // クリックそのものでは何も起こさない（保険）
  resetAllBtn.addEventListener('click', (e) => { e.preventDefault(); });

  // ---- 区間チップの長押し（注文なしマーク／取消）V14 ----
  const CHIP_HOLD_MS = 1400;
  let chipHoldTimer = null;
  let chipHoldEl = null;
  let chipHoldStartX = 0;
  let chipHoldStartY = 0;
  let chipTapCandidate = false;   // 短いタップかどうか（V16）
  let chipLongFired = false;      // 長押しが発動したか（V16）

  // ---- チップをタップ→その区間を選択（V16）----
  function selectSection(section) {
    if (!section) return;
    if (running) return;  // 計測中は区間を変えない（プルダウンも無効中）
    sectionSelect.value = section;
    renderSections();
    if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} }
  }
  sectionSelect.addEventListener('change', renderSections);

  function chipStateOf(section) {
    const info = sharedStatus[fbKey(section)];
    return info ? (info.state || 'done') : '';
  }

  // 記録一覧から、その区間の「一番新しい1件」を削除する
  function removeLatestRecord(section) {
    for (let i = records.length - 1; i >= 0; i--) {
      if (records[i].section === section) {
        records.splice(i, 1);
        saveRecords();
        updateTable();
        return;
      }
    }
  }

  function applyChipLongPress(section, state) {
    const key = fbKey(section);
    if (state === 'done' || state === 'skip') {
      // 赤 → グレー（未着手）に戻す
      if (db) { try { db.ref('status/' + key).remove(); } catch (e) {} }
      // 「完了」を取り消すときは、対応する記録一覧も1件消す
      if (state === 'done') removeLatestRecord(section);
    } else {
      // グレー（未着手）→「注文なし」（赤）
      if (db) {
        try {
          db.ref('status/' + key).set({
            state: 'skip',
            by: getUserName() || '誰か',
            at: formatClock(new Date())
          });
        } catch (e) {}
      } else {
        alert('オフラインのため共有できません。ネットにつながってから再度お試しください。');
      }
    }
  }

  function startChipHold(e) {
    const chip = e.target.closest('.chip');
    if (!chip || !sectionListEl.contains(chip)) return;
    const section = chip.getAttribute('data-section');
    // スワイプを妨げないため preventDefault はしない（V15）
    chipHoldStartX = e.clientX;
    chipHoldStartY = e.clientY;
    chipHoldEl = chip;
    chipTapCandidate = true;
    chipLongFired = false;
    // 計測中の区間は長押し操作なし（タップでの選択だけ受け付ける・V16）
    if (chipStateOf(section) === 'active') return;
    chipHolding = true;
    chip.classList.add('holding');
    chipHoldTimer = setTimeout(() => {
      chipHoldTimer = null;
      chipLongFired = true;
      chipTapCandidate = false;
      chip.classList.remove('holding');
      if (navigator.vibrate) { try { navigator.vibrate(30); } catch (e) {} }
      applyChipLongPress(section, chipStateOf(section));
      chipHolding = false;
      chipHoldEl = null;
      renderSections();
    }, CHIP_HOLD_MS);
  }

  // 指を離した時点で「長押しが発動していない＝タップ」なら区間を選択（V16）
  function onChipPointerUp() {
    if (chipTapCandidate && !chipLongFired && chipHoldEl) {
      selectSection(chipHoldEl.getAttribute('data-section'));
    }
    chipTapCandidate = false;
    cancelChipHold();
  }
  function cancelChipHold() {
    if (chipHoldTimer) { clearTimeout(chipHoldTimer); chipHoldTimer = null; }
    if (chipHoldEl) chipHoldEl.classList.remove('holding');
    chipHoldEl = null;
    chipHolding = false;
    if (pendingRender) renderSections();
  }
  function onChipMove(e) {
    if (!chipHoldEl) return;
    // 指が動いたらスワイプ（スクロール）とみなして長押し・タップを中止（V15/V16）
    if (Math.abs(e.clientX - chipHoldStartX) > 8 || Math.abs(e.clientY - chipHoldStartY) > 8) {
      chipTapCandidate = false;
      cancelChipHold();
      return;
    }
    const chip = e.target.closest('.chip');
    if (chip !== chipHoldEl) {
      chipTapCandidate = false;
      cancelChipHold();
    }
  }
  function onChipAbort() {
    chipTapCandidate = false;
    cancelChipHold();
  }
  sectionListEl.addEventListener('pointerdown', startChipHold);
  sectionListEl.addEventListener('pointermove', onChipMove);
  sectionListEl.addEventListener('pointerup', onChipPointerUp);
  sectionListEl.addEventListener('pointerleave', onChipAbort);
  sectionListEl.addEventListener('pointercancel', onChipAbort);
  window.addEventListener('scroll', onChipAbort, { passive: true });

  function formatDuration(ms) {
    return Math.floor(ms / 60000) + '分';
  }

  function formatClock(date) {
    return String(date.getHours()).padStart(2,'0') + ':' +
           String(date.getMinutes()).padStart(2,'0');
  }

  function saveRecords() {
    try { localStorage.setItem('nespaPT', JSON.stringify(records)); } catch (e) {}
  }

  function loadRecords() {
    try {
      const raw = localStorage.getItem('nespaPT');
      if (raw) records = JSON.parse(raw) || [];
    } catch (e) { records = []; }
  }

  // ---- 進行中セッションの保存／復元（V12）----
  // 計測中にリロード・タブ/ブラウザを閉じても、開き直したときに計測を継続できるようにする
  const ACTIVE_KEY = 'nespaPT_active';
  function saveActive() {
    try {
      localStorage.setItem(ACTIVE_KEY, JSON.stringify({
        section: currentSection,
        startTime: startTime,
        name: getUserName()
      }));
    } catch (e) {}
  }
  function clearActive() {
    try { localStorage.removeItem(ACTIVE_KEY); } catch (e) {}
  }

  function tick() {
    const elapsed = Date.now() - startTime;
    display.textContent = formatDuration(elapsed);
    rafId = requestAnimationFrame(tick);
  }

  function renderSections() {
    // 長押し中はDOMを作り替えない（操作が途切れないように／終わったら描き直す）
    if (chipHolding) { pendingRender = true; return; }
    pendingRender = false;
    let html = '';
    Array.from(sectionSelect.options).forEach(opt => {
      const info = sharedStatus[fbKey(opt.value)];
      let cls = '';
      let meta = '';
      if (info) {
        const state = info.state || 'done';
        const who = info.by ? escapeHtml(info.by) : '';
        const when = info.at ? escapeHtml(info.at) : '';
        if (state === 'active') {
          cls = ' active';
          const parts = [who, '計測中'].filter(Boolean).join(' ');
          meta = `<small>${parts}</small>`;
        } else if (state === 'skip') {
          cls = ' skip';
          const parts = ['注文なし', who].filter(Boolean).join(' ');
          meta = `<small>${parts}</small>`;
        } else {
          cls = ' done';
          const parts = [who, when].filter(Boolean).join(' ');
          if (parts) meta = `<small>${parts}</small>`;
        }
      }
      // 未着手（グレー）でも1行分のスペースを確保して高さを揃える（V15）
      if (!meta) meta = '<small>&nbsp;</small>';
      // いま選ばれている区間に枠を付ける（V16）
      if (opt.value === sectionSelect.value) cls += ' selected';
      html += `<span class="chip${cls}" data-section="${escapeHtml(opt.value)}"><span class="chip-fill"></span><span class="chip-label">${escapeHtml(opt.value)}${meta}</span></span>`;
    });
    sectionListEl.innerHTML = html;
  }

  function updateTable() {
    renderSections();
    if (records.length === 0) {
      tableWrap.innerHTML = '';
      tableWrap.appendChild(emptyMsg);
      totalRow.style.display = 'none';
      countEl.textContent = '0件';
      return;
    }
    let html = '<table><thead><tr><th>#</th><th>区間</th><th>開始</th><th>終了</th><th>経過</th></tr></thead><tbody>';
    let total = 0;
    records.forEach((r, i) => {
      total += r.durationMs;
      html += `<tr>
        <td class="num">${i+1}</td>
        <td>${r.section}</td>
        <td>${r.startStr}</td>
        <td>${r.endStr}</td>
        <td class="dur">${formatDuration(r.durationMs)}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    tableWrap.innerHTML = html;
    countEl.textContent = records.length + '件';
    totalRow.style.display = 'block';
    totalTimeEl.textContent = formatDuration(total);
  }

  startBtn.addEventListener('click', () => {
    // 共有の区間の状況をもとに、完了済み／計測中の区間なら確認する（V12）
    const selectedSection = sectionSelect.value;
    const selInfo = sharedStatus[fbKey(selectedSection)];
    if (selInfo) {
      const selState = selInfo.state || 'done';
      const selWho = selInfo.by || '誰か';
      if (selState === 'active') {
        alert('この区間は ' + selWho + ' さんが計測中です。');
        return;
      } else if (selState === 'done') {
        if (!confirm('この区間はすでに完了しています。もう一度計測し直しますか？')) return;
      } else if (selState === 'skip') {
        if (!confirm('この区間は「注文なし」になっています。計測しますか？')) return;
      }
    }
    running = true;
    startTime = Date.now();
    currentSection = sectionSelect.value;
    sectionSelect.disabled = true;
    userNameEl.disabled = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    clearBtn.disabled = true;
    status.textContent = '計測中';
    status.classList.remove('idle');
    cart.classList.add('active');
    document.body.classList.add('running');
    saveActive();
    if (db) {
      try {
        db.ref('status/' + fbKey(currentSection)).set({
          state: 'active',
          by: getUserName() || '誰か',
          at: formatClock(new Date(startTime))
        });
      } catch (e) {}
    }
    tick();
  });

  stopBtn.addEventListener('click', () => {
    if (!running) return;
    running = false;
    clearActive();
    cancelAnimationFrame(rafId);
    cart.classList.remove('active');
    document.body.classList.remove('running');
    const endTime = Date.now();
    const durationMs = endTime - startTime;
    records.push({
      section: currentSection,
      startStr: formatClock(new Date(startTime)),
      endStr: formatClock(new Date(endTime)),
      durationMs
    });
    saveRecords();
    display.textContent = formatDuration(durationMs);
    status.textContent = '停止中';
    status.classList.add('idle');
    sectionSelect.disabled = false;
    userNameEl.disabled = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    clearBtn.disabled = false;
    if (db) {
      try {
        db.ref('status/' + fbKey(currentSection)).set({
          state: 'done',
          by: getUserName() || '誰か',
          at: formatClock(new Date(endTime))
        });
      } catch (e) {}
    }
    updateTable();
  });

  // ---- 記録クリアも「長押し」で発動（誤タップ防止・V16）----
  const CLEAR_HOLD_MS = 1400;
  let clearHoldTimer = null;
  let clearHoldStartX = 0;
  let clearHoldStartY = 0;

  function doClearRecords() {
    records = [];
    saveRecords();
    display.textContent = '0分';
    updateTable();
  }
  function startClearHold(e) {
    if (clearHoldTimer) return;
    clearHoldStartX = e ? e.clientX : 0;
    clearHoldStartY = e ? e.clientY : 0;
    clearBtn.classList.add('holding');
    clearHoldTimer = setTimeout(() => {
      clearHoldTimer = null;
      clearBtn.classList.remove('holding');
      if (navigator.vibrate) { try { navigator.vibrate(40); } catch (e) {} }
      doClearRecords();
    }, CLEAR_HOLD_MS);
  }
  function cancelClearHold() {
    if (clearHoldTimer) { clearTimeout(clearHoldTimer); clearHoldTimer = null; }
    clearBtn.classList.remove('holding');
  }
  function onClearMove(e) {
    if (!clearHoldTimer) return;
    if (Math.abs(e.clientX - clearHoldStartX) > 8 || Math.abs(e.clientY - clearHoldStartY) > 8) {
      cancelClearHold();
    }
  }
  clearBtn.addEventListener('pointerdown', startClearHold);
  clearBtn.addEventListener('pointermove', onClearMove);
  clearBtn.addEventListener('pointerup', cancelClearHold);
  clearBtn.addEventListener('pointerleave', cancelClearHold);
  clearBtn.addEventListener('pointercancel', cancelClearHold);
  window.addEventListener('scroll', cancelClearHold, { passive: true });
  // クリックそのものでは何も起こさない（保険）
  clearBtn.addEventListener('click', (e) => { e.preventDefault(); });

  // 計測中に閉じた／リロードした場合、開き直したときに計測を復元して継続する（V12）
  function restoreActive() {
    let raw = null;
    try { raw = localStorage.getItem(ACTIVE_KEY); } catch (e) {}
    if (!raw) return;
    let s = null;
    try { s = JSON.parse(raw); } catch (e) { s = null; }
    if (!s || !s.section || !s.startTime) { clearActive(); return; }

    running = true;
    startTime = s.startTime;
    currentSection = s.section;
    if (s.name) userNameEl.value = s.name;
    sectionSelect.value = s.section;

    sectionSelect.disabled = true;
    userNameEl.disabled = true;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    clearBtn.disabled = true;
    status.textContent = '計測中';
    status.classList.remove('idle');
    cart.classList.add('active');
    document.body.classList.add('running');

    // 共有側にも「計測中」を再登録（開始時刻はそのまま維持）
    if (db) {
      try {
        db.ref('status/' + fbKey(currentSection)).set({
          state: 'active',
          by: getUserName() || '誰か',
          at: formatClock(new Date(startTime))
        });
      } catch (e) {}
    }
    tick();
  }

  loadRecords();
  updateTable();
  restoreActive();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
